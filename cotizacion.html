<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitar información | Pirámide Woodworks</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           PIRÁMIDE WOODWORKS
           ESTILO MINIMALISTA
        ========================================= */

        :root {
            --negro: #171717;
            --negro-suave: #222222;
            --blanco: #ffffff;
            --crema: #f7f5f1;
            --texto: #26221e;
            --texto-suave: #716b64;
            --dorado: #b28a52;
            --dorado-claro: #d1b27d;
            --linea: #e7e2db;
        }


        /* =========================================
           FONDO — IGUAL AL CATÁLOGO
        ========================================= */

        body {
            margin: 0;

            background:
                linear-gradient(
                    rgba(20, 14, 10, 0.78),
                    rgba(20, 14, 10, 0.88)
                ),
                repeating-linear-gradient(
                    92deg,
                    #3a281d 0px,
                    #493225 55px,
                    #34231a 58px,
                    #52382a 115px,
                    #39271c 118px
                );

            color: var(--blanco);

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;
        }


        /* =========================================
           ENCABEZADO
        ========================================= */

        header {
            text-align: center;

            padding: 48px 20px 30px;
        }

        header h1 {
            margin: 0;

            color: white;

            font-size: clamp(32px, 6vw, 48px);

            font-weight: 500;

            letter-spacing: 1px;
        }

        header p {
            margin: 9px 0 0;

            color: var(--dorado-claro);

            font-size: 14px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        /* =========================================
           CONTENEDOR
        ========================================= */

        main {
            width: 100%;

            max-width: 650px;

            margin: 0 auto;

            padding: 20px 24px 60px;
        }


        /* =========================================
           BOTÓN VOLVER
        ========================================= */

        .volver-catalogo {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 20px;

            color: rgba(255,255,255,.75);

            border: none;

            text-decoration: none;

            font-size: 13px;

            transition: color .2s ease;
        }

        .volver-catalogo:hover {
            color: var(--dorado-claro);
        }


        /* =========================================
           FORMULARIO
        ========================================= */

        .formulario {
            background: var(--blanco);

            color: var(--texto);

            padding: 28px;

            border-radius: 13px;

            box-shadow:
                0 8px 25px rgba(0,0,0,.14);

            text-align: left;
        }


        /* =========================================
           ETIQUETAS
        ========================================= */

        .formulario label {
            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            color: var(--texto);

            font-size: 13px;

            font-weight: 600;
        }

        .formulario label:first-child {
            margin-top: 0;
        }


        /* =========================================
           CAMPOS
        ========================================= */

        .formulario input,
        .formulario textarea {

            width: 100%;

            padding: 12px 13px;

            border: 1px solid var(--linea);

            border-radius: 7px;

            background: #faf9f7;

            color: var(--texto);

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            font-size: 14px;

            outline: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .formulario input:focus,
        .formulario textarea:focus {

            border-color: var(--dorado);

            box-shadow:
                0 0 0 3px rgba(178,138,82,.10);
        }

        .formulario input::placeholder,
        .formulario textarea::placeholder {

            color: #9a948d;
        }

        .formulario textarea {

            min-height: 120px;

            resize: vertical;
        }


        /* =========================================
           PEDIDO
        ========================================= */

        #producto-seleccionado {

            margin: 22px 0;

            padding: 17px;

            background: var(--crema);

            border: 1px solid var(--linea);

            border-radius: 9px;

            color: var(--texto-suave);

            font-size: 13px;

            line-height: 1.7;
        }

        #producto-seleccionado strong:first-child {

            color: var(--texto);

            font-size: 16px;

            font-weight: 600;
        }


        /* =========================================
           BOTÓN PRINCIPAL
        ========================================= */

        .formulario .boton-principal {

            width: 100%;

            margin-top: 17px;

            border: 1px solid var(--negro);

            border-radius: 7px;

            background: var(--negro);

            color: white;

            padding: 12px 16px;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            font-size: 14px;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease;
        }

        .formulario .boton-principal:hover {

            background: #000;

            border-color: var(--dorado);
        }


        /* =========================================
           TEXTO DE APOYO
        ========================================= */

        .texto-ayuda {

            margin: 12px 0 0;

            text-align: center;

            color: var(--texto-suave);

            font-size: 12px;

            line-height: 1.5;
        }


        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 700px) {

            header {
                padding-top: 35px;
            }

            main {
                padding-left: 15px;

                padding-right: 15px;
            }

            .formulario {
                padding: 22px 17px;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>Solicitar información</h1>

    <p>Pirámide Woodworks</p>

</header>


<main>


    <a
        href="catalogo.html"
        class="volver-catalogo"
    >
        ← Volver a categorías
    </a>


    <form
        class="formulario"
        onsubmit="enviarWhatsApp(event)"
    >


        <label for="nombre">
            Nombre
        </label>


        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Tu nombre"
            required
        >


        <label for="telefono">
            Teléfono
        </label>


        <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="Tu teléfono"
            required
        >


        <div id="producto-seleccionado"></div>


        <label for="mensaje">
            ¿Qué necesitas?
        </label>


        <textarea
            id="mensaje"
            name="mensaje"
            rows="5"
            placeholder="Escribe aquí tu pregunta o lo que necesitas cotizar"
        ></textarea>


        <button
            type="submit"
            class="boton-principal"
        >
            Enviar solicitud de información
        </button>


        <p class="texto-ayuda">
            Al enviar tu solicitud, se abrirá WhatsApp
            para continuar la conversación con Pirámide Woodworks.
        </p>


    </form>


</main>



<script>


const carrito =
    JSON.parse(localStorage.getItem("carrito")) || [];


const contenedorPedido =
    document.getElementById("producto-seleccionado");


if (carrito.length > 0) {

    let total = 0;


    contenedorPedido.innerHTML =
        "<strong>🛒 Tu pedido</strong><br><br>";


    carrito.forEach(function(producto) {

        const subtotal =
            producto.precio *
            producto.cantidad;


        total += subtotal;


        contenedorPedido.innerHTML +=
            producto.nombre +
            " × " +
            producto.cantidad +
            " — $" +
            subtotal +
            "<br>";

    });


    contenedorPedido.innerHTML +=
        "<br><strong>Total: $" +
        total +
        "</strong>";

}



function enviarWhatsApp(event) {

    event.preventDefault();


    const nombre =
        document.getElementById("nombre").value;


    const telefono =
        document.getElementById("telefono").value;


    const mensaje =
        document.getElementById("mensaje").value;


    const carrito =
        JSON.parse(localStorage.getItem("carrito")) || [];


    let texto =
        "Hola, quiero hacer un pedido en Pirámide Woodworks.\n\n" +
        "Nombre: " +
        nombre +
        "\n" +
        "Teléfono: " +
        telefono +
        "\n\n" +
        "Pedido:\n";


    let total = 0;


    carrito.forEach(function(producto) {

        const subtotal =
            producto.precio *
            producto.cantidad;


        total += subtotal;


        texto +=
            "- " +
            producto.nombre +
            " x " +
            producto.cantidad +
            " — $" +
            subtotal +
            "\n";

    });


    texto +=
        "\nTotal: $" +
        total;


    if (mensaje) {

        texto +=
            "\n\nMensaje: " +
            mensaje;

    }


    const numero =
        "528991194289";


    window.open(
        "https://wa.me/" +
        numero +
        "?text=" +
        encodeURIComponent(texto),
        "_blank"
    );


    localStorage.removeItem("carrito");

}


</script>


</body>

</html>
