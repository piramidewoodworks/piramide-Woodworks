<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pirámide Woodworks</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        :root {
            --negro: #171717;
            --blanco: #ffffff;
            --dorado: #b28a52;
            --dorado-claro: #d1b27d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(20, 14, 10, 0.78),
                    rgba(20, 14, 10, 0.88)
                ),
                repeating-linear-gradient(
                    92deg,
                    #3a281d 0px,
                    #493225 55px,
                    #34231a 58px,
                    #52382a 115px,
                    #39271c 118px
                );
            color: var(--blanco);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .portada {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
        }

        .contenido {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        .placa {
            display: inline-block;
            background: rgba(23, 23, 23, 0.96);
            border: 1px solid var(--dorado);
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 28px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        }

        .placa h1 {
            margin: 0;
            font-size: clamp(30px, 7vw, 46px);
            font-weight: 500;
            letter-spacing: 1px;
        }

        .placa p {
            margin: 8px 0 0;
            color: var(--dorado-claro);
            font-size: 13px;
            letter-spacing: 2px;
        }

        .logo-contenedor {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .logo-contenedor img {
            width: 235px;
            height: 235px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--dorado);
            background: #111;
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.35),
                0 0 55px rgba(178, 138, 82, 0.12);
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 360px;
            margin: 0 auto 18px;
        }

        .boton {
            display: block;
            padding: 14px 20px;
            background: var(--negro);
            color: white;
            text-decoration: none;
            border: 1px solid var(--dorado);
            border-radius: 8px;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: 0.25s ease;
        }

        .boton:hover {
            background: #252525;
            color: var(--dorado-claro);
            transform: translateY(-2px);
        }

        .proceso {
            margin: 5px auto 8px;
            max-width: 520px;
            color: var(--dorado-claro);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            line-height: 1.8;
            text-transform: uppercase;
        }

        .frase {
            margin: 0 0 24px;
            color: var(--dorado-claro);
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .redes {
            display: flex;
            justify-content: center;
            gap: 22px;
        }

        .redes a {
            color: white;
            font-size: 21px;
            transition: 0.25s ease;
        }

        .redes a:hover {
            color: var(--dorado-claro);
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .portada {
                padding: 25px 15px;
            }

            .placa {
                padding: 17px 20px;
                margin-bottom: 24px;
            }

            .logo-contenedor img {
                width: 205px;
                height: 205px;
            }

            .proceso {
                font-size: 10px;
                letter-spacing: 1.2px;
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>

    <div class="portada">

        <main class="contenido">

            <div class="placa">
                <h1>Pirámide Woodworks</h1>
                <p>Diseños en madera hechos para ti.</p>
            </div>

            <div class="logo-contenedor">
                <img
                    src="imagenes/logo.jpeg"
                    alt="Logo Pirámide Woodworks"
                >
            </div>

            <div class="botones">

                <a href="catalogo.html" class="boton">
                    Ver catálogo
                </a>

                <a href="cotizacion.html" class="boton">
                    Solicitar cotización
                </a>

            </div>

            <p class="proceso">
                DISEÑAMOS · CORTAMOS · GRABAMOS · LIJAMOS · ARMAMOS
            </p>

            <p class="frase">
                Hecho a mano · Personalizado · En madera
            </p>

            <div class="redes">

                <a
                    href="https://www.facebook.com/share/19JBxtRajm/"
                    target="_blank"
                    aria-label="Facebook"
                >
                    <i class="fab fa-facebook-f"></i>
                </a>

                <a
                    href="https://www.tiktok.com/@pirmide.woodworks?_r=1&_t=ZS-99ytydtc2sP"
                    target="_blank"
                    aria-label="TikTok"
                >
                    <i class="fab fa-tiktok"></i>
                </a>

                <a
                    href="https://wa.me/528991194289"
                    target="_blank"
                    aria-label="WhatsApp"
                >
                    <i class="fab fa-whatsapp"></i>
                </a>

            </div>

        </main>

    </div>

</body>
</html>
