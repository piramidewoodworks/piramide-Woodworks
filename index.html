<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pirámide Woodworks</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            background: #17120e;
        }

        /* =========================
           FONDO DE MADERA
        ========================== */

        .portada {
            min-height: 100vh;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at 20% 30%,
                    rgba(255, 220, 170, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    ellipse at 80% 70%,
                    rgba(0, 0, 0, 0.45),
                    transparent 40%
                ),
                repeating-linear-gradient(
                    91deg,
                    #4a3020 0px,
                    #5b3a25 55px,
                    #3b2619 57px,
                    #68432a 115px,
                    #452c1d 118px
                );
        }

        /* Vetas irregulares */

        .portada::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                repeating-radial-gradient(
                    ellipse at 30% 50%,
                    transparent 0px,
                    transparent 18px,
                    rgba(30, 16, 8, 0.12) 20px,
                    transparent 23px
                );

            opacity: .7;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* Oscurecimiento elegante */

        .portada::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,.45),
                    transparent 20%,
                    transparent 80%,
                    rgba(0,0,0,.45)
                ),
                linear-gradient(
                    180deg,
                    rgba(0,0,0,.35),
                    transparent 35%,
                    rgba(0,0,0,.5)
                );
            pointer-events: none;
        }

        /* =========================
           TRONCOS LATERALES
        ========================== */

        .troncos {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 180px;
            z-index: 2;
            pointer-events: none;
        }

        .izquierda {
            left: 0;
        }

        .derecha {
            right: 0;
        }

        .corte-tronco {
            position: absolute;
            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse at center,
                    #d29a5c 0 5%,
                    #704528 6% 10%,
                    #b8753f 11% 18%,
                    #58351f 19% 23%,
                    #a8693a 24% 33%,
                    #633c24 34% 39%,
                    #c0844b 40% 52%,
                    #56341f 53% 58%,
                    #8d5932 59% 72%,
                    #45291a 73% 100%
                );

            border: 7px solid #2b1b11;

            box-shadow:
                0 10px 25px rgba(0,0,0,.55),
                inset 0 0 12px rgba(0,0,0,.4);
        }

        .corte-tronco:nth-child(1) {
            width: 125px;
            height: 125px;
            top: 7%;
            left: -45px;
            transform: rotate(-14deg);
        }

        .corte-tronco:nth-child(2) {
            width: 82px;
            height: 82px;
            top: 43%;
            left: 55px;
            transform: rotate(20deg);
        }

        .corte-tronco:nth-child(3) {
            width: 140px;
            height: 140px;
            bottom: 6%;
            left: -50px;
            transform: rotate(9deg);
        }

        .derecha .corte-tronco:nth-child(1) {
            top: 13%;
            right: -45px;
            transform: rotate(15deg);
        }

        .derecha .corte-tronco:nth-child(2) {
            top: 48%;
            right: 55px;
            transform: rotate(-18deg);
        }

        .derecha .corte-tronco:nth-child(3) {
            bottom: 8%;
            right: -50px;
            transform: rotate(-10deg);
        }

        /* =========================
           CONTENIDO
        ========================== */

        .contenido {
            position: relative;
            z-index: 5;

            min-height: 100vh;
            width: min(850px, calc(100% - 40px));

            margin: auto;
            padding: 45px 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        /* =========================
           PLACA NEGRA
        ========================== */

        .placa {
            background: #11100f;

            border: 2px solid #b58a58;
            border-radius: 8px;

            padding: 20px 38px;

            box-shadow:
                0 12px 30px rgba(0,0,0,.55),
                inset 0 0 20px rgba(255,255,255,.025);

            margin-bottom: 30px;
        }

        .placa h1 {
            font-size: clamp(34px, 7vw, 58px);
            letter-spacing: 2px;
            color: #fff;
        }

        .placa p {
            margin-top: 8px;
            color: #c9a574;
            font-size: 17px;
        }

        /* =========================
           LOGO
        ========================== */

        .logo-contenedor {
            width: 235px;
            height: 235px;

            padding: 7px;
            border-radius: 50%;

            background: #080808;

            border: 3px solid #b58a58;

            box-shadow:
                0 15px 35px rgba(0,0,0,.65),
                0 0 0 7px rgba(0,0,0,.35);

            margin-bottom: 32px;
        }

        .logo-contenedor img {
            width: 100%;
            height: 100%;

            display: block;

            border-radius: 50%;

            object-fit: cover;
        }

        /* =========================
           BOTONES
        ========================== */

        .botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;

            margin-bottom: 28px;
        }

        .boton {
            min-width: 210px;

            padding: 15px 25px;

            border-radius: 7px;

            text-decoration: none;

            font-size: 16px;
            font-weight: bold;

            transition: .2s;

            box-shadow: 0 7px 18px rgba(0,0,0,.4);
        }

        .boton:hover {
            transform: translateY(-3px);
        }

        .catalogo {
            background: #b58a58;
            color: #fff;
        }

        .cotizacion {
            background: #111;
            color: #fff;
            border: 1px solid #b58a58;
        }

        /* =========================
           REDES
        ========================== */

        .redes {
            display: flex;
            gap: 13px;
        }

        .red-social {
            width: 47px;
            height: 47px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #111;
            color: #fff;

            border: 1px solid #b58a58;

            text-decoration: none;

            font-size: 20px;

            transition: .2s;
        }

        .red-social:hover {
            transform: translateY(-3px);
            background: #b58a58;
        }

        /* =========================
           CELULAR
        ========================== */

        @media (max-width: 650px) {

            .troncos {
                width: 85px;
                opacity: .75;
            }

            .corte-tronco {
                width: 75px !important;
                height: 75px !important;
            }

            .troncos .corte-tronco:nth-child(2) {
                display: none;
            }

            .contenido {
                width: calc(100% - 25px);
                padding: 35px 10px;
            }

            .placa {
                padding: 18px 15px;
            }

            .placa h1 {
                font-size: 34px;
            }

            .logo-contenedor {
                width: 190px;
                height: 190px;
            }

            .botones {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }

            .boton {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="portada">

        <!-- TRONCOS -->
        <div class="troncos izquierda">
            <div class="corte-tronco"></div>
            <div class="corte-tronco"></div>
            <div class="corte-tronco"></div>
        </div>

        <div class="troncos derecha">
            <div class="corte-tronco"></div>
            <div class="corte-tronco"></div>
            <div class="corte-tronco"></div>
        </div>

        <!-- CONTENIDO -->
        <main class="contenido">

            <div class="placa">
                <h1>Pirámide Woodworks</h1>
                <p>Diseños en madera hechos para ti.</p>
            </div>

            <div class="logo-contenedor">
                <img src="imagenes/logo.jpeg"
                     alt="Logo Pirámide Woodworks">
            </div>

            <div class="botones">

                <a href="catalogo.html"
                   class="boton catalogo">
                    🪵 Ver catálogo
                </a>

                <a href="Cotizacion.html"
                   class="boton cotizacion">
                    ✨ Solicitar cotización
                </a>

            </div>

            <div class="redes">

                <a href="https://www.facebook.com/share/19JBxtRajm/"
                   target="_blank"
                   class="red-social"
                   aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a href="https://www.tiktok.com/@pirmide.woodworks?_r=1&_t=ZS-99ytydtc2sP"
                   target="_blank"
                   class="red-social"
                   aria-label="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>

                <a href="https://wa.me/528991194289"
                   target="_blank"
                   class="red-social"
                   aria-label="WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>

            </div>

        </main>

    </div>

</body>

</html>
