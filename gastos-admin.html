<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos | Pirámide Woodworks</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --negro:#171717;
    --blanco:#fff;
    --texto:#26221e;
    --suave:#716b64;
    --dorado:#b28a52;
    --claro:#d1b27d;
    --linea:#e7e2db;
    --rojo:#9b3d3d;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        linear-gradient(
            rgba(20,14,10,.82),
            rgba(20,14,10,.9)
        ),
        repeating-linear-gradient(
            92deg,
            #3a281d 0,
            #493225 55px,
            #34231a 58px,
            #52382a 115px,
            #39271c 118px
        );
    font-family:"Segoe UI",Arial,sans-serif;
    color:var(--blanco);
}

header{
    text-align:center;
    padding:34px 16px 22px;
}

header h1{
    margin:0;
    font-size:clamp(30px,6vw,44px);
    font-weight:500;
    letter-spacing:.3px;
}

header p{
    margin:8px 0 0;
    color:var(--claro);
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
}

main{
    width:min(100% - 28px,1000px);
    margin:0 auto 45px;
}

.volver{
    display:inline-block;
    margin-bottom:18px;
    color:var(--claro);
    text-decoration:none;
    font-size:14px;
}

.acciones{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.acciones h2{
    margin:0;
    font-size:21px;
    font-weight:500;
}

.boton{
    border:1px solid var(--dorado);
    background:var(--negro);
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}

.boton:hover{
    background:#292929;
    border-color:var(--claro);
}

/* RESUMEN */

.resumen{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.resumen-card{
    background:rgba(255,255,255,.97);
    color:var(--texto);
    border-radius:12px;
    padding:17px 12px;
    text-align:center;
    box-shadow:0 8px 25px #0002;
}

.resumen-card span{
    display:block;
    color:var(--suave);
    font-size:11px;
    margin-bottom:6px;
}

.resumen-card strong{
    display:block;
    color:var(--dorado);
    font-size:22px;
    font-weight:600;
}

/* FILTROS */

.filtros{
    background:#fffffff7;
    padding:14px;
    border-radius:12px;
    margin-bottom:16px;
    box-shadow:0 8px 25px #0002;
}

.filtros-grid{
    display:grid;
    grid-template-columns:1fr 190px 170px;
    gap:9px;
}

.filtros input,
.filtros select{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--linea);
    border-radius:7px;
    background:white;
    color:var(--texto);
    font:inherit;
    font-size:13px;
    outline:none;
}

/* GASTOS */

.gasto{
    background:#fffffff7;
    color:var(--texto);
    border-radius:12px;
    padding:18px;
    margin-bottom:12px;
    box-shadow:0 8px 25px #0002;
}

.gasto-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
}

.gasto h3{
    margin:0 0 5px;
    font-size:17px;
    font-weight:600;
}

.fecha{
    color:var(--suave);
    font-size:12px;
}

.gasto-total{
    color:var(--rojo);
    font-size:19px;
    font-weight:600;
    white-space:nowrap;
}

.gasto-info{
    margin-top:12px;
    line-height:1.65;
    font-size:13px;
}

.gasto-info strong{
    font-weight:600;
}

.gasto-acciones{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--linea);
}

.boton-secundario{
    border:1px solid var(--linea);
    background:white;
    color:var(--texto);
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
}

.boton-eliminar{
    color:var(--rojo);
}

/* VACIO */

.vacio{
    background:#fffffff7;
    color:var(--suave);
    border-radius:12px;
    padding:30px 18px;
    text-align:center;
    font-size:13px;
}

/* ESTADO */

.estado{
    text-align:center;
    color:var(--claro);
    font-size:12px;
    margin:0 0 14px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000a;
    align-items:center;
    justify-content:center;
    padding:12px;
    z-index:1000;
}

.modal-contenido{
    background:white;
    color:var(--texto);
    width:min(100%,600px);
    max-height:94vh;
    overflow-y:auto;
    border-radius:14px;
    padding:21px;
}

.modal-contenido h2{
    margin:0 0 18px;
    font-size:21px;
    font-weight:500;
}

.campo{
    margin-bottom:13px;
}

.campo label{
    display:block;
    color:var(--suave);
    font-size:12px;
    margin-bottom:6px;
}

.campo input,
.campo select,
.campo textarea{
    width:100%;
    padding:10px;
    border:1px solid var(--linea);
    border-radius:7px;
    font:inherit;
    font-size:14px;
    outline:none;
    background:white;
    color:var(--texto);
}

.campo textarea{
    min-height:80px;
    resize:vertical;
}

.modal-botones{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
    margin-top:18px;
}

/* MOVIL */

@media(max-width:750px){

    .resumen{
        grid-template-columns:repeat(3,1fr);
    }

    .filtros-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .resumen{
        gap:8px;
    }

    .resumen-card{
        padding:14px 6px;
    }

    .resumen-card span{
        font-size:10px;
    }

    .resumen-card strong{
        font-size:17px;
    }

    .gasto-top{
        flex-direction:row;
    }

    .gasto{
        padding:16px;
    }

    .gasto-total{
        font-size:17px;
    }

}

</style>
</head>

<body>

<header>
    <h1>Gastos</h1>
    <p>Pirámide Woodworks</p>
</header>

<main>

<a href="panel.html" class="volver">
    ← Volver al panel
</a>

<div id="estadoConexion" class="estado">
    Cargando gastos...
</div>

<div class="acciones">

    <h2>Registro de gastos</h2>

    <button
        class="boton"
        onclick="abrirModal()">
        + Nuevo gasto
    </button>

</div>

<section class="resumen">

    <div class="resumen-card">
        <span>Gastos registrados</span>
        <strong id="totalGastos">0</strong>
    </div>

    <div class="resumen-card">
        <span>Gastos del periodo</span>
        <strong id="gastosPeriodo">$0</strong>
    </div>

    <div class="resumen-card">
        <span>Total gastado</span>
        <strong id="totalGastado">$0</strong>
    </div>

</section>

<section class="filtros">

    <div class="filtros-grid">

        <input

            id="busqueda"

        >

        <select

            <option value="Todas">

            <option value="Materiales">
                Materiales

            <option value="Herramientas">
                Herramientas
            </option>

            <option value="Equipo">
                Equipo
            </option>

            <option value="Empaque">
                Empaque
            </option>

            <option value="Envíos">
                Envíos
            </option>

            <option value="Publicidad">
                Publicidad
            </option>

            <option value="Servicios">
                Servicios
            </option>

            <option value="Otro">
                Otro
            </option>

        </select>

        <select
            id="filtroFecha"
            onchange="mostrarGastos()">

            <option value="hoy">
                Hoy
            </option>

            <option value="semana">
                Esta semana
            </option>

            <option value="mes" selected>
                Este mes
            </option>

        </select>

<section id="listaGastos"></section>

</main>


<div class="modal" id="modalGasto">

    <div class="modal-contenido">

        <h2 id="tituloModal">
            Nuevo gasto
        </h2>

        <div class="campo">

            <label for="descripcion">
                Descripción
            </label>

            <input
                type="text"
                id="descripcion"
                placeholder="Ej. Triplay Birch 4mm"
            >

        </div>


        <div class="campo">

            <label for="categoria">
                Categoría
            </label>

            <select id="categoria">

                <option value="Materiales">
                    Materiales
                </option>

                <option value="Herramientas">
                    Herramientas
                </option>

                <option value="Equipo">
                    Equipo
                </option>

                <option value="Empaque">
                    Empaque
                </option>

                <option value="Envíos">
                    Envíos
                </option>

                <option value="Publicidad">
                    Publicidad
                </option>

                <option value="Servicios">
                    Servicios
                </option>

                <option value="Otro">
                    Otro
                </option>

            </select>

        </div>

            <select id="metodo">

                <option value="Efectivo">
                    Efectivo
                </option>

                <option value="Transferencia">
                    Transferencia
                </option>

                <option value="Tarjeta">
                    Tarjeta

            </button>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://ighcydtijeumeqyhuvkh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_gI5akJYFXtqZxadDOuC4zg_cUCyXofV";

const supabaseCliente =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let gastos = [];

let modoEdicionId = null;


/* =========================
   FECHA DE HOY
========================= */

function obtenerFechaHoy(){

    const fecha = new Date();

    return (
        fecha.getFullYear() +
        "-" +
        String(
            fecha.getMonth() + 1
        ).padStart(2,"0") +
        "-" +
        String(
            fecha.getDate()
        ).padStart(2,"0")
    );

}


/* =========================
   FECHA LOCAL
========================= */

function fechaLocal(valor){

    if(!valor){
        return null;
    }

    const texto =
        String(valor).slice(0,10);

    const partes =
        texto.split("-");

    if(partes.length !== 3){
        return null;
    }

    return new Date(
        Number(partes[0]),
        Number(partes[1]) - 1,
        Number(partes[2])
    );

}


/* =========================
   FECHA BONITA
========================= */

function fechaBonita(valor){

    const fecha =
        fechaLocal(valor);

    if(!fecha){
        return "—";
    }

    return (
        String(fecha.getDate()).padStart(2,"0") +
        "/" +
        String(
            fecha.getMonth() + 1
        ).padStart(2,"0") +
        "/" +
        fecha.getFullYear()
    );

}


/* =========================
   DINERO
========================= */

function dinero(valor){

    return "$" +
        Number(valor || 0).toLocaleString(
            "es-MX",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );

}


/* =========================
   INICIO DE SEMANA
========================= */

function inicioSemana(){

    const hoy =
        new Date();

    hoy.setHours(
        0,0,0,0
    );

    const dia =
        hoy.getDay();

    const diferencia =
        dia === 0
            ? 6
            : dia - 1;

    hoy.setDate(
        hoy.getDate() - diferencia
    );

    return hoy;

}


/* =========================
   FILTRO DE FECHA
========================= */

function gastoDentroDelFiltro(
    fecha
){

    const filtro =
        document.getElementById(
            "filtroFecha"
        ).value;


    if(filtro === "todo"){
        return true;
    }


    const fechaGasto =
        fechaLocal(fecha);


    if(!fechaGasto){
        return false;
    }


    const hoy =
        new Date();

    hoy.setHours(
        0,0,0,0
    );


    if(filtro === "hoy"){

        return (
            fechaGasto.getTime() ===
            hoy.getTime()
        );

    }


    if(filtro === "semana"){

        return (
            fechaGasto >=
            inicioSemana()
        );

    }


    if(filtro === "mes"){

        return (
            fechaGasto.getMonth() ===
                hoy.getMonth() &&
            fechaGasto.getFullYear() ===
                hoy.getFullYear()
        );

    }


    return true;

}


/* =========================
   MIGRACIÓN
========================= */

async function migrarGastosAntiguos(){

    const yaMigro =
        localStorage.getItem(
            "gastosMigradosSupabase"
        );


    if(yaMigro === "true"){
        return;
    }


    let gastosAntiguos = [];


    try{

        gastosAntiguos =
            JSON.parse(
                localStorage.getItem(
                    "gastos"
                )
            ) || [];

    }catch(error){

        console.warn(
            "No se pudieron leer gastos antiguos.",
            error
        );

        gastosAntiguos = [];

    }


    if(gastosAntiguos.length === 0){

        localStorage.setItem(
            "gastosMigradosSupabase",
            "true"
        );

        return;

    }


    const datosParaSubir =
        gastosAntiguos.map(
            function(gasto){

                return {

                    descripcion:
                        gasto.descripcion || "",

                    categoria:
                        gasto.categoria || "Otro",

                    monto:
                        Number(gasto.monto) || 0,

                    metodo:
                        gasto.metodo || "Efectivo",

                    notas:
                        gasto.notas || "",

                    fecha:
                        gasto.fecha ||
                        obtenerFechaHoy()

                };

            }
        );


    const { error } =
        await supabaseCliente
            .from("gastos")
            .insert(
                datosParaSubir
            );


    if(error){

        console.error(
            "Error migrando gastos:",
            error
        );

        return;

    }


    localStorage.setItem(
        "gastosMigradosSupabase",
        "true"
    );

}


/* =========================
   CARGAR GASTOS
========================= */

async function cargarGastos(){

    const estado =
        document.getElementById(
            "estadoConexion"
        );


    const {
        data,
        error
    } =
        await supabaseCliente
            .from("gastos")
            .select("*")
            .order(
                "fecha",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            "Error cargando gastos:",
            error
        );

        estado.textContent =
            "No se pudieron cargar los gastos.";

        return;

    }


    gastos =
        data || [];


    estado.textContent =
        "Gastos sincronizados";


    mostrarGastos();

}


/* =========================
   ABRIR MODAL
========================= */

function abrirModal(){

    modoEdicionId = null;


    document.getElementById(
        "tituloModal"
    ).textContent =
        "Nuevo gasto";


    document.getElementById(
        "guardarBtn"
    ).textContent =
        "Guardar gasto";


    document.getElementById(
        "descripcion"
    ).value = "";


    document.getElementById(
        "categoria"
    ).value =
        "Materiales";


    document.getElementById(
        "monto"
    ).value = "";


    document.getElementById(
        "metodo"
    ).value =
        "Efectivo";


    document.getElementById(
        "fechaGasto"
    ).value =
        obtenerFechaHoy();


    document.getElementById(
        "notas"
    ).value = "";


    document.getElementById(
        "modalGasto"
    ).style.display =
        "flex";

}


/* =========================
   CERRAR MODAL
========================= */

function cerrarModal(){

    document.getElementById(
        "modalGasto"
    ).style.display =
        "none";

    modoEdicionId = null;

}


/* =========================
   EDITAR GASTO
========================= */

function editarGasto(id){

    const gasto =
        gastos.find(
            function(item){
                return Number(item.id) ===
                       Number(id);
            }
        );


    if(!gasto){
        return;
    }


    modoEdicionId =
        gasto.id;


    document.getElementById(
        "tituloModal"
    ).textContent =
        "Editar gasto";


    document.getElementById(
        "guardarBtn"
    ).textContent =
        "Guardar cambios";


    document.getElementById(
        "descripcion"
    ).value =
        gasto.descripcion || "";


    document.getElementById(
        "categoria"
    ).value =
        gasto.categoria || "Otro";


    document.getElementById(
        "monto"
    ).value =
        gasto.monto || "";


    document.getElementById(
        "metodo"
    ).value =
        gasto.metodo || "Efectivo";


    document.getElementById(
        "fechaGasto"
    ).value =
        String(
            gasto.fecha ||
            obtenerFechaHoy()
        ).slice(0,10);


    document.getElementById(
        "notas"
    ).value =
        gasto.notas || "";


    document.getElementById(
        "modalGasto"
    ).style.display =
        "flex";

}


/* =========================
   GUARDAR / EDITAR
========================= */

async function guardarGasto(){

    const descripcion =
        document.getElementById(
            "descripcion"
        ).value.trim();


    const categoria =
        document.getElementById(
            "categoria"
        ).value;


    const monto =
        Number(
            document.getElementById(
                "monto"
            ).value
        );


    const metodo =
        document.getElementById(
            "metodo"
        ).value;


    const fecha =
        document.getElementById(
            "fechaGasto"
        ).value;


    const notas =
        document.getElementById(
            "notas"
        ).value.trim();


    if(
        !descripcion ||
        !monto ||
        monto <= 0 ||
        !fecha
    ){

        alert(
            "Completa descripción, monto y fecha."
        );

        return;

    }


    const btn =
        document.getElementById(
            "guardarBtn"
        );


    btn.disabled = true;

    btn.textContent =
        "Guardando...";


    const registro = {

        descripcion:
            descripcion,

        categoria:
            categoria,

        monto:
            monto,

        metodo:
            metodo,

        notas:
            notas,

        fecha:
            fecha

    };


    let resultado;


    if(modoEdicionId){

        resultado =
            await supabaseCliente
                .from("gastos")
                .update(registro)
                .eq(
                    "id",
                    modoEdicionId
                );

    }else{

        resultado =
            await supabaseCliente
                .from("gastos")
                .insert(
                    registro
                );

    }


    if(resultado.error){

        console.error(
            "Error guardando gasto:",
            resultado.error
        );

        alert(
            "No se pudo guardar el gasto."
        );

        btn.disabled = false;

        btn.textContent =
            modoEdicionId
                ? "Guardar cambios"
                : "Guardar gasto";

        return;

    }


    cerrarModal();

    btn.disabled = false;

    btn.textContent =
        "Guardar gasto";


    await cargarGastos();

}


/* =========================
   MOSTRAR GASTOS
========================= */

function mostrarGastos(){

    const contenedor =
        document.getElementById(
            "listaGastos"
        );


    const busqueda =
        document.getElementById(
            "busqueda"
        ).value
        .toLowerCase()
        .trim();


    const filtroCategoria =
        document.getElementById(
            "filtroCategoria"
        ).value;


    const filtrados =
        gastos.filter(
            function(gasto){

                const texto =
                    (
                        (gasto.descripcion || "") +
                        " " +
                        (gasto.notas || "")
                    )
                    .toLowerCase();


                const coincideBusqueda =
                    texto.includes(
                        busqueda
                    );


                const coincideCategoria =
                    filtroCategoria === "Todas" ||
                    gasto.categoria ===
                        filtroCategoria;


                const coincideFecha =
                    gastoDentroDelFiltro(
                        gasto.fecha
                    );


                return (
                    coincideBusqueda &&
                    coincideCategoria &&
                    coincideFecha
                );

            }
        );


    contenedor.innerHTML = "";


    if(filtrados.length === 0){

        contenedor.innerHTML =
            `
            <div class="vacio">
                No hay gastos para mostrar.
            </div>
            `;

    }else{

        filtrados.forEach(
            function(gasto){

                const tarjeta =
                    document.createElement(
                        "article"
                    );


                tarjeta.className =
                    "gasto";


                tarjeta.innerHTML =
                    `

                    <div class="gasto-top">

                        <div>

                            <h3>
                                ${escapar(
                                    gasto.descripcion
                                )}
                            </h3>

                            <div class="fecha">
                                ${fechaBonita(
                                    gasto.fecha
                                )}
                            </div>

                        </div>

                        <div class="gasto-total">
                            -${dinero(
                                gasto.monto
                            )}
                        </div>

                    </div>


                    <div class="gasto-info">

                        <strong>Categoría:</strong>
                        ${escapar(
                            gasto.categoria || "Otro"
                        )}

                        <br>

                        <strong>Pago:</strong>
                        ${escapar(
                            gasto.metodo || "Otro"
                        )}

                        ${
                            gasto.notas
                                ? `
                                <br>
                                <strong>Notas:</strong>
                                ${escapar(
                                    gasto.notas
                                )}
                                `
                                : ""
                        }

                    </div>


                    <div class="gasto-acciones">

                        <button
                            class="boton-secundario"
                            onclick="editarGasto(${Number(
                                gasto.id
                            )})">

                            Editar

                        </button>


                        <button
                            class="boton-secundario boton-eliminar"
                            onclick="eliminarGasto(${Number(
                                gasto.id
                            )})">

                            Eliminar

                        </button>

                    </div>

                    `;


                contenedor.appendChild(
                    tarjeta
                );

            }
        );

    }


    actualizarResumen();

}


/* =========================
   ESCAPAR TEXTO
========================= */

function escapar(valor){

    return String(
        valor ?? ""
    ).replace(
        /[&<>"']/g,
        function(caracter){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"

            }[caracter];

        }
    );

}


/* =========================
   ELIMINAR
========================= */

async function eliminarGasto(id){

    const confirmar =
        confirm(
            "¿Seguro que quieres eliminar este gasto?"
        );


    if(!confirmar){
        return;
    }


    const { error } =
        await supabaseCliente
            .from("gastos")
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        console.error(
            "Error eliminando gasto:",
            error
        );

        alert(
            "No se pudo eliminar el gasto."
        );

        return;

    }


    await cargarGastos();

}


/* =========================
   RESUMEN
========================= */

function actualizarResumen(){

    document.getElementById(
        "totalGastos"
    ).textContent =
        gastos.length;


    let totalPeriodo = 0;

    let totalGeneral = 0;


    gastos.forEach(
        function(gasto){

            const monto =
                Number(
                    gasto.monto
                ) || 0;


            totalGeneral +=
                monto;


            if(
                gastoDentroDelFiltro(
                    gasto.fecha
                )
            ){

                totalPeriodo +=
                    monto;

            }

        }
    );


    document.getElementById(
        "gastosPeriodo"
    ).textContent =
        dinero(totalPeriodo);


    document.getElementById(
        "totalGastado"
    ).textContent =
        dinero(totalGeneral);

}


/* =========================
   INICIO
========================= */

async function iniciarGastos(){

    await migrarGastosAntiguos();

    await cargarGastos();

}


iniciarGastos();

</script>
