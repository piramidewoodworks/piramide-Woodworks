<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cotizaciones | Pirámide Woodworks</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --negro: #171717;
            --blanco: #ffffff;
            --crema: #f7f5f1;
            --texto: #26221e;
            --texto-suave: #716b64;
            --dorado: #b28a52;
            --dorado-claro: #d1b27d;
            --linea: #e7e2db;
            --verde: #4f664b;
            --rojo: #8b5f4b;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: white;

            background:
                linear-gradient(
                    rgba(20, 14, 10, .82),
                    rgba(20, 14, 10, .92)
                ),
                repeating-linear-gradient(
                    92deg,
                    #3a281d 0px,
                    #493225 55px,
                    #34231a 58px,
                    #52382a 115px,
                    #39271c 118px
                );
        }

        header {
            text-align: center;
            padding: 35px 20px 25px;
        }

        header h1 {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 500;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 8px;
            color: var(--dorado-claro);
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .contenedor {
            width: min(1100px, calc(100% - 30px));
            margin: auto;
            padding-bottom: 60px;
        }

        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .volver {
            color: rgba(255,255,255,.75);
            text-decoration: none;
            font-size: 13px;
        }

        .volver:hover {
            color: var(--dorado-claro);
        }

        .boton-nueva {
            border: 1px solid var(--dorado);
            background: var(--dorado);
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
        }

        .boton-nueva:hover {
            background: #9a713b;
        }

        .resumen {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 13px;
            margin-bottom: 25px;
        }

        .resumen-card {
            background: rgba(255,255,255,.97);
            color: var(--texto);
            border-radius: 11px;
            padding: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,.15);
        }

        .resumen-card span {
            display: block;
            color: var(--texto-suave);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .resumen-card strong {
            font-size: 24px;
        }

        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .filtros input,
        .filtros select {
            padding: 11px 12px;
            border: 1px solid var(--linea);
            border-radius: 7px;
            background: white;
            color: var(--texto);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .filtros input {
            flex: 1;
            min-width: 220px;
        }

        .filtros input:focus,
        .filtros select:focus {
            border-color: var(--dorado);
        }

        #lista-cotizaciones {
            display: grid;
            gap: 15px;
        }

        .cotizacion {
            background: rgba(255,255,255,.97);
            color: var(--texto);
            border-radius: 13px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,.16);
        }

        .cotizacion-superior {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .cotizacion h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .fecha {
            margin-top: 5px;
            color: var(--texto-suave);
            font-size: 12px;
        }

        .estado {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .pendiente {
            background: #f4ece3;
            color: #76553a;
        }

        .contactado {
            background: #eee8dc;
            color: #725d36;
        }

        .cotizado {
            background: #e9eee8;
            color: #4f664b;
        }

        .aceptada {
            background: #e5efe5;
            color: #456142;
        }

        .en-proceso {
            background: #e8ecef;
            color: #4d606d;
        }

        .entregada {
            background: #e5e5e5;
            color: #555;
        }

        .cancelada {
            background: #f1e5e2;
            color: #8b5f4b;
        }

        .cerrado {
            background: #e7e7e7;
            color: #555;
        }

        .datos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 18px;
            padding-top: 17px;
            border-top: 1px solid var(--linea);
        }

        .dato span {
            display: block;
            color: var(--texto-suave);
            font-size: 11px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .dato strong {
            font-size: 14px;
            font-weight: 600;
        }

        .dato.total strong {
            color: var(--verde);
            font-size: 16px;
        }

        .mensaje {
            margin-top: 15px;
            padding: 13px;
            background: #faf8f4;
            border-radius: 8px;
            color: #5f5a54;
            font-size: 13px;
            line-height: 1.5;
        }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 17px;
        }

        .acciones button,
        .acciones a {
            padding: 9px 12px;
            border-radius: 6px;
            border: 1px solid var(--linea);
            background: white;
            color: var(--texto);
            text-decoration: none;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .acciones button:hover,
        .acciones a:hover {
            border-color: var(--dorado);
        }

        .eliminar {
            color: var(--rojo) !important;
        }

        .vacio {
            background: rgba(255,255,255,.97);
            color: var(--texto);
            border-radius: 13px;
            padding: 40px 25px;
            text-align: center;
        }

        .vacio h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .vacio p {
            color: var(--texto-suave);
            font-size: 14px;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.72);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #modal.visible {
            display: flex;
        }

        .modal-contenido {
            width: min(560px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            color: var(--texto);
            border-radius: 14px;
            padding: 25px;
        }

        .modal-contenido h2 {
            margin-bottom: 18px;
            font-size: 21px;
        }

        .campo {
            margin-bottom: 13px;
        }

        .campo label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .campo input,
        .campo textarea,
        .campo select {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--linea);
            border-radius: 7px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            background: white;
            color: var(--texto);
        }

        .campo input:focus,
        .campo textarea:focus,
        .campo select:focus {
            border-color: var(--dorado);
        }

        .campo textarea {
            min-height: 90px;
            resize: vertical;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .precio-info {
            margin-top: 6px;
            color: var(--texto-suave);
            font-size: 11px;
        }

        .total-modal {
            margin-top: 8px;
            padding: 13px;
            border-radius: 8px;
            background: #f4f1eb;
            text-align: right;
        }

        .total-modal span {
            display: block;
            color: var(--texto-suave);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .total-modal strong {
            display: block;
            margin-top: 4px;
            color: var(--verde);
            font-size: 22px;
        }

        .modal-botones {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .modal-botones button {
            flex: 1;
            padding: 11px;
            border-radius: 7px;
            cursor: pointer;
            font-family: inherit;
        }

        .guardar {
            background: var(--negro);
            color: white;
            border: 1px solid var(--negro);
        }

        .cancelar {
            background: white;
            color: var(--texto);
            border: 1px solid var(--linea);
        }

        @media (max-width: 800px) {

            .resumen {
                grid-template-columns: 1fr 1fr;
            }

            .datos {
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (max-width: 550px) {

            .contenedor {
                width: calc(100% - 20px);
            }

            .barra {
                align-items: stretch;
                flex-direction: column;
            }

            .boton-nueva {
                width: 100%;
            }

            .datos {
                grid-template-columns: 1fr;
            }

            .cotizacion-superior {
                flex-direction: column;
            }

            .fila {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header>

</main>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ighcydtijeumeqyhuvkh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_gI5akJYFXtqZxadDOuC4zg_cUCyXofV";

const supabaseCliente =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let cotizaciones = [];

let indiceEditando = null;


const preciosProductos = {

    "BottleBox": 600,

    "TequilaBox": 1200,

    "TequilaBox sin botella": 480,

    "GiftBox": 550,

    "SlidingBox": 400,

    "Portallaves Home": 130,

    "Mostrador QR & Códigos Personalizado": 120,

    "Carruaje de Cenicienta": 155,

    "Mesa Carruaje Gigante": 2500

};


/* =========================
   FUNCIONES GENERALES
========================= */

function formatearFecha(fecha) {

    if (!fecha) {
        return "—";
    }

    const partes =
        String(fecha).split("-");

    if (partes.length !== 3) {
        return fecha;
    }

    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


function dinero(valor) {

    const numero =
        Number(valor) || 0;

    return "$" +
        numero.toLocaleString(
            "es-MX",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }
        );

}


function claseEstado(estado) {

    return String(estado || "")
        .toLowerCase()
        .replace(/\s+/g, "-")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


function obtenerFechaHoy() {

    const hoy =
        new Date();

    const anio =
        hoy.getFullYear();

    const mes =
        String(
            hoy.getMonth() + 1
        ).padStart(2, "0");

    const dia =
        String(
            hoy.getDate()
        ).padStart(2, "0");

    return (
        anio +
        "-" +
        mes +
        "-" +
        dia
    );

}


function limpiarTelefono(telefono) {

    return String(telefono)
        .replace(/\D/g, "");

}


/* =========================
   MIGRACIÓN DE COTIZACIONES
========================= */

async function migrarCotizacionesAntiguas() {

    const yaMigro =
        localStorage.getItem(
            "cotizacionesMigradasSupabase"
        );

    if (yaMigro === "true") {
        return;
    }


    const cotizacionesAntiguas =
        JSON.parse(
            localStorage.getItem("cotizaciones")
        ) || [];


    if (cotizacionesAntiguas.length === 0) {

        localStorage.setItem(
            "cotizacionesMigradasSupabase",
            "true"
        );

        return;
    }


    const datosParaSubir =
        cotizacionesAntiguas.map(function(c) {

            let fechaCotizacion =
                c.fechaCotizacion;

            if (!fechaCotizacion) {

                fechaCotizacion =
                    convertirFechaAntigua(c.fecha);

            }


            let estado =
                c.estado || "Pendiente";


            if (estado === "Cerrado") {
                estado = "Entregada";
            }


            const precio =
                Number(c.precio) || 0;

            const descuento =
                Number(c.descuento) || 0;

            const total =
                c.total !== undefined
                ? Number(c.total) || 0
                : Math.max(
                    0,
                    precio - descuento
                );


            return {

                cliente:
                    c.cliente || "",

                telefono:
                    c.telefono || "",

                producto:
                    c.producto || "",

                precio:
                    precio,

                descuento:
                    descuento,

                total:
                    total,

                fechaCotizacion:
                    fechaCotizacion ||
                    obtenerFechaHoy(),

                fechaEntrega:
                    c.fechaEntrega || null,

                estado:
                    estado,

                notas:
                    c.notas || "",

                fecha:
                    fechaCotizacion ||
                    obtenerFechaHoy()

            };

        });


    const { error } =
        await supabaseCliente
            .from("cotizaciones")
            .insert(datosParaSubir);


    if (error) {

        console.error(
            "Error migrando cotizaciones:",
            error
        );

        alert(
            "No se pudieron sincronizar las cotizaciones anteriores."
        );

        return;
    }


    localStorage.setItem(
        "cotizacionesMigradasSupabase",
        "true"
    );


    console.log(
        "Cotizaciones antiguas migradas correctamente."
    );

}


/* =========================
   FECHAS ANTIGUAS
========================= */

function convertirFechaAntigua(fecha) {

    if (!fecha) {
        return obtenerFechaHoy();
    }

    const texto =
        String(fecha);

    const partes =
        texto.split(",");


    if (partes.length > 0) {

        const fechaParte =
            partes[0].trim();

        const separada =
            fechaParte.split("/");


        if (separada.length === 3) {

            let dia =
                separada[0].padStart(2, "0");

            let mes =
                separada[1].padStart(2, "0");

            let anio =
                separada[2];


            if (anio.length === 2) {
                anio = "20" + anio;
            }


            return (
                anio +
                "-" +
                mes +
                "-" +
                dia
            );

        }

    }


    return obtenerFechaHoy();

}


/* =========================
   CARGAR COTIZACIONES
========================= */

async function cargarCotizaciones() {

    const { data, error } =
        await supabaseCliente
            .from("cotizaciones")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(
            "Error cargando cotizaciones:",
            error
        );

        alert(
            "No se pudieron cargar las cotizaciones."
        );

        return;
    }


    cotizaciones =
        data || [];


    mostrarCotizaciones();

}


/* =========================
   MOSTRAR COTIZACIONES
========================= */

function mostrarCotizaciones() {

    const lista =
        document.getElementById(
            "lista-cotizaciones"
        );


    const busqueda =
        document.getElementById(
            "busqueda"
        ).value.toLowerCase();


    const filtro =
        document.getElementById(
            "filtro-estado"
        ).value;


    lista.innerHTML = "";


    const filtradas =
        cotizaciones.filter(function(cotizacion) {

            const texto =
                (
                    cotizacion.cliente +
                    " " +
                    cotizacion.telefono +
                    " " +
                    cotizacion.producto
                ).toLowerCase();


            const coincideTexto =
                texto.includes(busqueda);


            const coincideEstado =
                filtro === "todos" ||
                cotizacion.estado === filtro;


            return (
                coincideTexto &&
                coincideEstado
            );

        });


    if (filtradas.length === 0) {

        lista.innerHTML = `

            <div class="vacio">

                <h2>
                    No hay cotizaciones
                </h2>

                <p>
                    Cuando agregues una cotización,
                    aparecerá aquí.
                </p>

            </div>

        `;

    } else {

        filtradas.forEach(function(cotizacion) {

            const indice =
                cotizaciones.indexOf(cotizacion);


            lista.innerHTML += `

                <article class="cotizacion">

                    <div class="cotizacion-superior">

                        <div>

                            <h2>
                                ${cotizacion.cliente}
                            </h2>

                            <div class="fecha">
                                Cotización:
                                ${formatearFecha(cotizacion.fechaCotizacion)}
                            </div>

                        </div>

                        <span
                            class="estado ${claseEstado(cotizacion.estado)}"
                        >
                            ${cotizacion.estado}
                        </span>

                    </div>


                    <div class="datos">

                        <div class="dato">

                            <span>
                                Teléfono
                            </span>

                            <strong>
                                ${cotizacion.telefono || "—"}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Producto
                            </span>

                            <strong>
                                ${cotizacion.producto || "—"}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Precio
                            </span>

                            <strong>
                                ${dinero(cotizacion.precio)}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Descuento
                            </span>

                            <strong>
                                ${
                                    Number(cotizacion.descuento) > 0
                                    ? dinero(cotizacion.descuento)
                                    : "Sin descuento"
                                }
                            </strong>

                        </div>


                        <div class="dato total">

                            <span>
                                Total
                            </span>

                            <strong>
                                ${dinero(cotizacion.total)}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Entrega
                            </span>

                            <strong>
                                ${formatearFecha(cotizacion.fechaEntrega)}
                            </strong>

                        </div>

                    </div>


                    ${
                        cotizacion.notas
                        ? `
                            <div class="mensaje">
                                ${cotizacion.notas}
                            </div>
                        `
                        : ""
                    }


                    <div class="acciones">

                        ${
                            cotizacion.telefono
                            ? `
                                <a
                                    href="https://wa.me/52${limpiarTelefono(cotizacion.telefono)}"
                                    target="_blank"
                                >
                                    WhatsApp
                                </a>
                            `
                            : ""
                        }


                        <button
                            onclick="editarCotizacion(${indice})"
                        >
                            Editar
                        </button>


                        <button
                            class="eliminar"
                            onclick="eliminarCotizacion(${indice})"
                        >
                            Eliminar
                        </button>

                    </div>

                </article>

            `;

        });

    }


    actualizarResumen();

}


/* =========================
   RESUMEN
========================= */

function actualizarResumen() {

    document.getElementById("total")
        .textContent =
        cotizaciones.length;


    document.getElementById("pendientes")
        .textContent =
        cotizaciones.filter(function(c) {

            return (
                c.estado === "Pendiente" ||
                c.estado === "Contactado"
            );

        }).length;


    document.getElementById("cotizadas")
        .textContent =
        cotizaciones.filter(function(c) {

            return c.estado === "Cotizado";

        }).length;


    document.getElementById("cerradas")
        .textContent =
        cotizaciones.filter(function(c) {

            return (
                c.estado === "Entregada" ||
                c.estado === "Cancelada"
            );

        }).length;

}


/* =========================
   PRODUCTOS Y PRECIOS
========================= */

function actualizarPrecio() {

    const producto =
        document.getElementById(
            "nuevo-producto"
        ).value;


    const precio =
        preciosProductos[producto] || 0;


    document.getElementById(
        "nuevo-precio"
    ).value =
        precio || "";


    calcularTotal();

}


function calcularTotal() {

    const precio =
        Number(
            document.getElementById(
                "nuevo-precio"
            ).value
        ) || 0;


    const descuento =
        Number(
            document.getElementById(
                "nuevo-descuento"
            ).value
        ) || 0;


    const total =
        Math.max(
            0,
            precio - descuento
        );


    document.getElementById(
        "nuevo-total"
    ).textContent =
        dinero(total);

}


/* =========================
   MODAL
========================= */

function abrirNuevaCotizacion() {

    indiceEditando = null;


    document.getElementById(
        "titulo-modal"
    ).textContent =
        "Nueva cotización";


    limpiarFormulario();


    document.getElementById(
        "modal"
    ).classList.add("visible");

}


function cerrarModal() {

    document.getElementById(
        "modal"
    ).classList.remove("visible");

}


function limpiarFormulario() {

    document.getElementById(
        "nuevo-cliente"
    ).value = "";


    document.getElementById(
        "nuevo-telefono"
    ).value = "";


    document.getElementById(
        "nuevo-producto"
    ).value = "";


    document.getElementById(
        "nuevo-precio"
    ).value = "";


    document.getElementById(
        "nuevo-descuento"
    ).value = "0";


    document.getElementById(
        "nueva-fecha"
    ).value =
        obtenerFechaHoy();


    document.getElementById(
        "nueva-fecha-entrega"
    ).value = "";


    document.getElementById(
        "nuevo-estado"
    ).value =
        "Pendiente";


    document.getElementById(
        "nuevas-notas"
    ).value = "";


    calcularTotal();

}


/* =========================
   GUARDAR / EDITAR
========================= */

async function guardarNuevaCotizacion() {

    const cliente =
        document.getElementById(
            "nuevo-cliente"
        ).value.trim();


    const telefono =
        document.getElementById(
            "nuevo-telefono"
        ).value.trim();


    const producto =
        document.getElementById(
            "nuevo-producto"
        ).value;


    const precio =
        Number(
            document.getElementById(
                "nuevo-precio"
            ).value
        ) || 0;


    const descuento =
        Number(
            document.getElementById(
                "nuevo-descuento"
            ).value
        ) || 0;


    const fechaCotizacion =
        document.getElementById(
            "nueva-fecha"
        ).value;


    const fechaEntrega =
        document.getElementById(
            "nueva-fecha-entrega"
        ).value;


    const estado =
        document.getElementById(
            "nuevo-estado"
        ).value;


    const notas =
        document.getElementById(
            "nuevas-notas"
        ).value.trim();


    const total =
        Math.max(
            0,
            precio - descuento
        );


    if (!cliente) {

        alert(
            "Escribe el nombre del cliente."
        );

        return;

    }


    if (!producto) {

        alert(
            "Selecciona un producto."
        );

        return;

    }


    if (precio <= 0) {

        alert(
            "Agrega el precio del producto."
        );

        return;

    }


    if (descuento > precio) {

        alert(
            "El descuento no puede ser mayor que el precio."
        );

        return;

    }


    const datos = {

        cliente:
            cliente,

        telefono:
            telefono,

        producto:
            producto,

        precio:
            precio,

        descuento:
            descuento,

        total:
            total,

        fechaCotizacion:
            fechaCotizacion ||
            obtenerFechaHoy(),

        fechaEntrega:
            fechaEntrega || null,

        estado:
            estado,

        notas:
            notas,

        fecha:
            fechaCotizacion ||
            obtenerFechaHoy()

    };


    /* NUEVA COTIZACIÓN */

    if (indiceEditando === null) {

        const { error } =
            await supabaseCliente
                .from("cotizaciones")
                .insert(datos);


        if (error) {

            console.error(
                "Error guardando cotización:",
                error
            );

            alert(
                "No se pudo guardar la cotización."
            );

            return;
        }


        alert(
            "☁️ Cotización guardada y sincronizada."
        );

    }


    /* EDITAR COTIZACIÓN */

    else {

        const cotizacion =
            cotizaciones[indiceEditando];


        const { error } =
            await supabaseCliente
                .from("cotizaciones")
                .update(datos)
                .eq("id", cotizacion.id);


        if (error) {

            console.error(
                "Error actualizando cotización:",
                error
            );

            alert(
                "No se pudo actualizar la cotización."
            );

            return;
        }


        alert(
            "☁️ Cotización actualizada y sincronizada."
        );

    }


    indiceEditando = null;


    cerrarModal();


    await cargarCotizaciones();

}


/* =========================
   EDITAR
========================= */

function editarCotizacion(indice) {

    const cotizacion =
        cotizaciones[indice];


    indiceEditando =
        indice;


    document.getElementById(
        "titulo-modal"
    ).textContent =
        "Editar cotización";


    document.getElementById(
        "nuevo-cliente"
    ).value =
        cotizacion.cliente || "";


    document.getElementById(
        "nuevo-telefono"
    ).value =
        cotizacion.telefono || "";


    document.getElementById(
        "nuevo-producto"
    ).value =
        cotizacion.producto || "";


    document.getElementById(
        "nuevo-precio"
    ).value =
        cotizacion.precio || "";


    document.getElementById(
        "nuevo-descuento"
    ).value =
        cotizacion.descuento || 0;


    document.getElementById(
        "nueva-fecha"
    ).value =
        cotizacion.fechaCotizacion ||
        obtenerFechaHoy();


    document.getElementById(
        "nueva-fecha-entrega"
    ).value =
        cotizacion.fechaEntrega || "";


    document.getElementById(
        "nuevo-estado"
    ).value =
        cotizacion.estado ||
        "Pendiente";


    document.getElementById(
        "nuevas-notas"
    ).value =
        cotizacion.notas || "";


    calcularTotal();


    document.getElementById(
        "modal"
    ).classList.add("visible");

}


/* =========================
   ELIMINAR
========================= */

async function eliminarCotizacion(indice) {

    const confirmar =
        confirm(
            "¿Quieres eliminar esta cotización?"
        );


    if (!confirmar) {
        return;
    }


    const cotizacion =
        cotizaciones[indice];


    const { error } =
        await supabaseCliente
            .from("cotizaciones")
            .delete()
            .eq("id", cotizacion.id);


    if (error) {

        console.error(
            "Error eliminando cotización:",
            error
        );

        alert(
            "No se pudo eliminar la cotización."
        );

        return;
    }


    await cargarCotizaciones();

}


/* =========================
   CERRAR MODAL AL HACER CLICK FUERA
========================= */

window.onclick = function(event) {

    const modal =
        document.getElementById(
            "modal"
        );


    if (event.target === modal) {

        cerrarModal();

    }

};


/* =========================
   INICIO
========================= */

async function iniciarCotizaciones() {

    await migrarCotizacionesAntiguas();

    await cargarCotizaciones();

}


iniciarCotizaciones();

</script>
