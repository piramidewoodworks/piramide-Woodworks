<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizaciones | Pirámide Woodworks</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(18,12,8,.94), rgba(18,12,8,.97)),
        url("imagenes/logo.jpeg") center/cover fixed;
      color: #f4eee7;
    }

    .contenedor {
      width: min(1200px, 94%);
      margin: auto;
      padding: 30px 0 60px;
    }

    .encabezado {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .titulo {
      margin: 0;
      font-size: 30px;
      color: #f3c27b;
      letter-spacing: .5px;
    }

    .subtitulo {
      margin: 7px 0 0;
      color: #bdb2a8;
      font-size: 14px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .boton-principal {
      background: #c88a3d;
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    .boton-principal:hover {
      background: #dda353;
    }

    .barra {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .barra input,
    .barra select {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #4a392d;
      background: #211710;
      color: #fff;
      outline: none;
    }

    .resumen {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 25px;
    }

    .tarjeta-resumen {
      background: #211710;
      border: 1px solid #463529;
      border-radius: 12px;
      padding: 18px;
    }

    .tarjeta-resumen span {
      display: block;
      color: #a99c91;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .tarjeta-resumen strong {
      font-size: 28px;
      color: #f3c27b;
    }

    .lista {
      display: grid;
      gap: 12px;
    }

    .cotizacion {
      background: #211710;
      border: 1px solid #463529;
      border-radius: 13px;
      overflow: hidden;
    }

    /* =========================================================
       ENCABEZADO DE CADA COTIZACIÓN
    ========================================================= */

    .cotizacion-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      transition: background .2s ease;
    }

    .cotizacion-cabecera:hover {
      background: #291d15;
    }

    .cotizacion-identidad {
      min-width: 0;
      flex: 1;
    }

    .cliente-linea {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .folio {
      color: #c88a3d;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      letter-spacing: .3px;
    }

    .cliente {
      font-size: 19px;
      font-weight: bold;
      color: #f3c27b;
      overflow-wrap: anywhere;
    }

    .fecha-cabecera {
      color: #a99c91;
      font-size: 12px;
      white-space: nowrap;
    }

    .telefono {
      color: #aaa099;
      font-size: 13px;
      margin-top: 5px;
    }

    .cabecera-derecha {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .estado {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 20px;
      background: #3b2a1d;
      color: #e7b96f;
      font-size: 12px;
      font-weight: bold;
      height: fit-content;
    }

    .flecha {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #33251c;
      color: #e7b96f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: transform .2s ease, background .2s ease;
    }

    .cotizacion.abierta .flecha {
      transform: rotate(180deg);
      background: #493426;
    }

    /* =========================================================
       CONTENIDO DESPLEGABLE
    ========================================================= */

    .cotizacion-detalle {
      display: none;
      padding: 0 20px 20px;
      border-top: 1px solid #3c2d23;
    }

    .cotizacion.abierta .cotizacion-detalle {
      display: block;
    }

    .datos {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-top: 18px;
    }

    .dato {
      background: #18110d;
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }

    .dato small {
      display: block;
      color: #94887e;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .dato strong {
      color: #eee5dc;
      font-size: 14px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .dato-total strong {
      color: #f3c27b;
      font-size: 18px;
    }

    .notas {
      margin-top: 14px;
      padding: 12px;
      border-left: 3px solid #c88a3d;
      background: #18110d;
      color: #c8beb5;
      font-size: 13px;
      line-height: 1.4;
    }

    .acciones {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .boton-secundario,
    .boton-eliminar {
      padding: 9px 13px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
    }

    .boton-secundario {
      background: #33251c;
      color: #e8d8c7;
      border: 1px solid #594331;
    }

    .boton-secundario:hover {
      background: #493426;
    }

    .boton-eliminar {
      background: #3b1e1b;
      color: #e7a69c;
      border: 1px solid #62322d;
    }

    .vacio {
      text-align: center;
      padding: 50px 20px;
      color: #9e938a;
      background: #211710;
      border: 1px solid #463529;
      border-radius: 13px;
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.activo {
      display: flex;
    }

    .modal-contenido {
      width: min(720px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: #211710;
      border: 1px solid #55402f;
      border-radius: 14px;
      padding: 25px;
    }

    .modal-contenido h2 {
      margin-top: 0;
      color: #f3c27b;
    }

    .formulario {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .campo.completo {
      grid-column: 1 / -1;
    }

    .campo label {
      color: #b9aea5;
      font-size: 12px;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 11px;
      border-radius: 7px;
      border: 1px solid #4b392d;
      background: #17100c;
      color: #fff;
      outline: none;
      font-family: inherit;
    }

    .campo textarea {
      min-height: 90px;
      resize: vertical;
    }

    .total-formulario {
      grid-column: 1 / -1;
      background: #17100c;
      border-radius: 9px;
      padding: 15px;
      border: 1px solid #3e2e23;
    }

    .linea-total {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin: 6px 0;
      color: #c4b8ae;
    }

    .linea-total strong {
      color: #f3c27b;
    }

    .modal-acciones {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 800px) {

      .contenedor {
        width: 94%;
        padding: 22px 0 45px;
      }

      .encabezado {
        gap: 14px;
        margin-bottom: 20px;
      }

      .titulo {
        font-size: 28px;
      }

      .resumen {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .tarjeta-resumen {
        padding: 12px 8px;
      }

      .tarjeta-resumen span {
        font-size: 11px;
        white-space: nowrap;
      }

      .tarjeta-resumen strong {
        font-size: 22px;
      }

      .datos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .dato {
        min-width: 0;
        padding: 11px;
      }

      .acciones {
        gap: 8px;
      }

      .boton-secundario,
      .boton-eliminar {
        flex: 1 1 0;
        min-width: 0;
      }
    }

    /* =========================================================
       CELULAR
    ========================================================= */

    @media (max-width: 560px) {

      .contenedor {
        width: 94%;
        padding-top: 16px;
      }

      /* Encabezado compacto */
      .encabezado {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }

      .encabezado > div {
        min-width: 0;
        width: auto;
      }

      .titulo {
        font-size: 22px;
        white-space: nowrap;
      }

      .subtitulo {
        display: none;
      }

      .encabezado .boton-principal {
        width: auto;
        padding: 9px 11px;
        font-size: 11px;
        white-space: nowrap;
      }

      /* Buscador + filtro juntos */
      .barra {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(110px, .8fr);
        gap: 7px;
        margin-bottom: 14px;
      }

      .barra input,
      .barra select {
        min-width: 0;
        width: 100%;
        padding: 10px 9px;
        font-size: 12px;
      }

      /* Resumen */
      .resumen {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
        margin-bottom: 15px;
      }

      .tarjeta-resumen {
        padding: 8px 3px;
        border-radius: 8px;
      }

      .tarjeta-resumen span {
        font-size: 8px;
        margin-bottom: 4px;
      }

      .tarjeta-resumen strong {
        font-size: 18px;
      }

      /* Cotización cerrada */
      .lista {
        gap: 8px;
      }

      .cotizacion {
        border-radius: 10px;
      }

      .cotizacion-cabecera {
        padding: 12px 11px;
        gap: 7px;
      }

      .cliente-linea {
        gap: 5px;
        flex-wrap: wrap;
      }

      .folio {
        font-size: 9px;
      }

      .cliente {
        font-size: 14px;
      }

      .fecha-cabecera {
        font-size: 9px;
      }

      .telefono {
        font-size: 10px;
        margin-top: 3px;
      }

      .cabecera-derecha {
        gap: 5px;
      }

      .estado {
        padding: 4px 6px;
        font-size: 8px;
      }

      .flecha {
        width: 23px;
        height: 23px;
        font-size: 12px;
      }

      /* Detalle desplegado */
      .cotizacion-detalle {
        padding: 0 11px 12px;
      }

      .datos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding-top: 11px;
      }

      .dato {
        padding: 8px;
        border-radius: 6px;
        min-height: 48px;
      }

      .dato small {
        font-size: 8px;
        margin-bottom: 3px;
      }

      .dato strong {
        font-size: 11px;
        line-height: 1.25;
      }

      .dato-total strong {
        font-size: 14px;
      }

      .notas {
        margin-top: 8px;
        padding: 9px;
        font-size: 10px;
      }

      /* Botones */
      .acciones {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
        margin-top: 10px;
      }

      .boton-secundario,
      .boton-eliminar {
        width: 100%;
        min-width: 0;
        padding: 8px 3px;
        font-size: 10px;
        white-space: nowrap;
      }

      /* Modal */
      .modal {
        padding: 10px;
      }

      .modal-contenido {
        padding: 18px;
        border-radius: 12px;
      }

      .formulario {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .campo.completo {
        grid-column: auto;
      }

      .modal-acciones {
        flex-direction: column-reverse;
      }

      .modal-acciones button {
        width: 100%;
      }
    }

    /* =========================================================
       PANTALLAS MUY PEQUEÑAS
    ========================================================= */

    @media (max-width: 380px) {

      .titulo {
        font-size: 20px;
      }

      .encabezado .boton-principal {
        font-size: 10px;
        padding: 8px 9px;
      }

      .barra {
        grid-template-columns: minmax(0, 1.3fr) minmax(100px, .8fr);
      }

      .resumen {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .tarjeta-resumen {
        padding: 8px;
      }

      .tarjeta-resumen span {
        font-size: 9px;
      }

      .tarjeta-resumen strong {
        font-size: 18px;
      }

      .cliente {
        font-size: 13px;
      }

      .fecha-cabecera {
        width: 100%;
      }

      .estado {
        display: none;
      }

      .acciones {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .boton-secundario,
      .boton-eliminar {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <div>
      <h1 class="titulo">Cotizaciones</h1>
      <p class="subtitulo">
        Administración de cotizaciones de Pirámide Woodworks
      </p>
    </div>

    <button
      class="boton-principal"
      onclick="abrirNuevaCotizacion()">
      Nueva cotización
    </button>
  </div>

  <div class="resumen">

    <div class="tarjeta-resumen">
      <span>Total</span>
      <strong id="resumenTotal">0</strong>
    </div>

    <div class="tarjeta-resumen">
      <span>Pendientes</span>
      <strong id="resumenPendientes">0</strong>
    </div>

    <div class="tarjeta-resumen">
      <span>Cotizadas</span>
      <strong id="resumenCotizadas">0</strong>
    </div>

    <div class="tarjeta-resumen">
      <span>Entregadas</span>
      <strong id="resumenEntregadas">0</strong>
    </div>

  </div>

  <div class="barra">

    <input
      type="text"
      id="buscador"
      placeholder="Buscar cliente, teléfono o producto..."
      oninput="mostrarCotizaciones()">

    <select
      id="filtroEstado"
      onchange="mostrarCotizaciones()">

      <option value="">
        Todos los estados
      </option>

      <option value="Pendiente">
        Pendiente
      </option>

      <option value="Contactado">
        Contactado
      </option>

      <option value="Cotizado">
        Cotizado
      </option>

      <option value="Cerrado">
        Cerrado
      </option>

    </select>

  </div>

  <div
    id="listaCotizaciones"
    class="lista">
  </div>

</div>

<!-- =========================================================
     MODAL
========================================================= -->

<div
  id="modal"
  class="modal">

  <div class="modal-contenido">

    <h2 id="tituloModal">
      Nueva cotización
    </h2>

    <div class="formulario">

      <div class="campo">

        <label>
          Cliente
        </label>

        <input
          type="text"
          id="cliente">

      </div>

      <div class="campo">

        <label>
          Teléfono
        </label>

        <input
          type="text"
          id="telefono">

      </div>

      <div class="campo">

        <label>
          Producto
        </label>

        <select
          id="producto"
          onchange="actualizarPrecioProducto()">

          <option value="BottleBox">
            BottleBox
          </option>

          <option value="TequilaBox">
            TequilaBox
          </option>

          <option value="TequilaBox sin botella">
            TequilaBox sin botella
          </option>

          <option value="GiftBox">
            GiftBox
          </option>

          <option value="SlidingBox">
            SlidingBox
          </option>

          <option value="Portallaves Home">
            Portallaves Home
          </option>

          <option value="Mostrador QR & Códigos Personalizado">
            Mostrador QR & Códigos Personalizado
          </option>

          <option value="Carruaje de Cenicienta">
            Carruaje de Cenicienta
          </option>

          <option value="Mesa Carruaje Gigante">
            Mesa Carruaje Gigante
          </option>

        </select>

      </div>

      <div class="campo">

        <label>
          Cantidad
        </label>

        <input
          type="number"
          id="cantidad"
          min="1"
          value="1"
          oninput="calcularTotal()">

      </div>

      <div class="campo">

        <label>
          Precio unitario
        </label>

        <input
          type="number"
          id="precio"
          readonly>

      </div>

      <div class="campo">

        <label>
          Descuento (%)
        </label>

        <input
          type="number"
          id="descuentoPorcentaje"
          min="0"
          max="100"
          step="0.01"
          value="0"
          oninput="calcularTotal()">

      </div>

      <div class="campo">

        <label>
          Abono
        </label>

        <input
          type="number"
          id="abono"
          min="0"
          step="0.01"
          value="0"
          oninput="calcularTotal()">

      </div>

      <div class="campo">

        <label>
          Fecha de cotización
        </label>

        <input
          type="date"
          id="fechaCotizacion">

      </div>

      <div class="campo">

        <label>
          Fecha de entrega
        </label>

        <input
          type="date"
          id="fechaEntrega">

      </div>

      <div class="campo">

        <label>
          Estado
        </label>

        <select id="estado">

          <option value="Pendiente">
            Pendiente
          </option>

          <option value="Contactado">
            Contactado
          </option>

          <option value="Cotizado">
            Cotizado
          </option>

          <option value="Cerrado">
            Cerrado
          </option>

        </select>

      </div>

      <div class="campo completo">

        <label>
          Notas
        </label>

        <textarea
          id="notas">
        </textarea>

      </div>

      <div class="total-formulario">

        <div class="linea-total">
          <span>Subtotal</span>
          <strong id="mostrarSubtotal">
            $0.00
          </strong>
        </div>

        <div class="linea-total">
          <span>Descuento</span>
          <strong id="mostrarDescuento">
            $0.00
          </strong>
        </div>

        <div class="linea-total">
          <span>Precio final por pieza</span>
          <strong id="mostrarPrecioFinal">
            $0.00
          </strong>
        </div>

        <div class="linea-total">
          <span>Total</span>
          <strong id="mostrarTotal">
            $0.00
          </strong>
        </div>

        <div class="linea-total">
          <span>Abono</span>
          <strong id="mostrarAbono">
            $0.00
          </strong>
        </div>

        <div class="linea-total">
          <span>Restante</span>
          <strong id="mostrarRestante">
            $0.00
          </strong>
        </div>

      </div>

    </div>

    <div class="modal-acciones">

      <button
        class="boton-secundario"
        onclick="cerrarModal()">
        Cancelar
      </button>

      <button
        class="boton-principal"
        onclick="guardarNuevaCotizacion()">
        Guardar cotización
      </button>

    </div>

  </div>
</div>

<script>

const SUPABASE_URL =
  "https://ighcydtijeumeqyhuvkh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_gI5akJYFXtqZxadDOuC4zg_cUCyXofV";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let cotizaciones = [];

let editandoId = null;

const preciosProductos = {

  "BottleBox": 600,

  "TequilaBox": 1200,

  "TequilaBox sin botella": 480,

  "GiftBox": 550,

  "SlidingBox": 400,

  "Portallaves Home": 130,

  "Mostrador QR & Códigos Personalizado": 120,

  "Carruaje de Cenicienta": 155,

  "Mesa Carruaje Gigante": 2500

};

/* =========================================================
   UTILIDADES
========================================================= */

function dinero(valor) {

  return Number(valor || 0)
    .toLocaleString(
      "es-MX",
      {
        style: "currency",
        currency: "MXN"
      }
    );
}

function fechaBonita(fecha) {

  if (!fecha) return "—";

  const partes =
    String(fecha).split("-");

  if (partes.length !== 3) {
    return fecha;
  }

  return `
    ${partes[2]}/${partes[1]}/${partes[0]}
  `;
}

/*
 * Folio visible.
 *
 * Se utiliza el ID real de Supabase para que el folio
 * permanezca estable aunque la cotización se edite.
 */
function obtenerFolio(cotizacion) {

  const numero =
    Number(cotizacion.id || 0);

  return (
    "COT-" +
    String(numero).padStart(3, "0")
  );
}

function actualizarPrecioProducto() {

  const producto =
    document.getElementById(
      "producto"
    ).value;

  document.getElementById(
    "precio"
  ).value =
    preciosProductos[producto] || 0;

  calcularTotal();
}

/* =========================================================
   CALCULOS
========================================================= */

function calcularTotal() {

  const cantidad =
    Number(
      document.getElementById(
        "cantidad"
      ).value
    ) || 0;

  const precio =
    Number(
      document.getElementById(
        "precio"
      ).value
    ) || 0;

  const descuentoPorcentaje =
    Number(
      document.getElementById(
        "descuentoPorcentaje"
      ).value
    ) || 0;

  const abono =
    Number(
      document.getElementById(
        "abono"
      ).value
    ) || 0;

  const subtotal =
    cantidad * precio;

  const montoDescuento =
    subtotal *
    (
      descuentoPorcentaje /
      100
    );

  const total =
    Math.max(
      0,
      subtotal -
      montoDescuento
    );

  const precioFinal =
    cantidad > 0
      ? total / cantidad
      : 0;

  const abonoReal =
    Math.min(
      Math.max(
        0,
        abono
      ),
      total
    );

  const restante =
    Math.max(
      0,
      total -
      abonoReal
    );

  document.getElementById(
    "mostrarSubtotal"
  ).textContent =
    dinero(subtotal);

  document.getElementById(
    "mostrarDescuento"
  ).textContent =
    dinero(montoDescuento);

  document.getElementById(
    "mostrarPrecioFinal"
  ).textContent =
    dinero(precioFinal);

  document.getElementById(
    "mostrarTotal"
  ).textContent =
    dinero(total);

  document.getElementById(
    "mostrarAbono"
  ).textContent =
    dinero(abonoReal);

  document.getElementById(
    "mostrarRestante"
  ).textContent =
    dinero(restante);
}

/* =========================================================
   RESUMEN
========================================================= */

function actualizarResumen() {

  document.getElementById(
    "resumenTotal"
  ).textContent =
    cotizaciones.length;

  document.getElementById(
    "resumenPendientes"
  ).textContent =
    cotizaciones.filter(
      c =>

  document.getElementById(
    "resumenCotizadas"
  ).textContent =
    cotizaciones.filter(
      c =>
        c.estado ===
        "Cotizado"
    ).length;

  document.getElementById(
    "resumenEntregadas"
  ).textContent =
    cotizaciones.filter(
      c =>
        c.estado ===
        "Cerrado"
    ).length;
}

/* =========================================================
   DESPLEGAR / CONTRAER
========================================================= */

function alternarCotizacion(id) {

  const elemento =
    document.getElementById(
      "cotizacion-" + id
    );

  if (!elemento) return;

  elemento.classList.toggle(
    "abierta"
  );
}

/*
 * Evita que al tocar Editar, Ticket o Eliminar
 * también se abra/cierre la cotización.
 */
function detenerDespliegue(event) {

  if (event) {
    event.stopPropagation();
  }
}

/* =========================================================
   MOSTRAR COTIZACIONES
========================================================= */

function mostrarCotizaciones() {

  const lista =
    document.getElementById(
      "listaCotizaciones"
    );

  const texto =
    document.getElementById(
      "buscador"
    ).value
      .toLowerCase()
      .trim();

  const filtro =
    document.getElementById(
      "filtroEstado"
    ).value;

  const filtradas =
    cotizaciones.filter(
      c => {

        const coincideTexto =
          !texto ||

          String(
            c.cliente || ""
          )
            .toLowerCase()
            .includes(texto) ||

          String(
            c.telefono || ""
          )
            .toLowerCase()
            .includes(texto) ||

          String(
            c.producto || ""
          )
            .toLowerCase()
            .includes(texto) ||

          obtenerFolio(c)
            .toLowerCase()
            .includes(texto);

        const coincideEstado =
          !filtro ||
          c.estado === filtro;

        return (
          coincideTexto &&
          coincideEstado
        );
      }
    );

  if (!filtradas.length) {

    lista.innerHTML = `
      <div class="vacio">
        No hay cotizaciones para mostrar.
      </div>
    `;

    return;
  }

  lista.innerHTML =
    filtradas.map(
      c => {

        const cantidad =
          Number(
            c.cantidad || 0
          );

        const precio =
          Number(
            c.precio || 0
          );

        const subtotal =
          Number(
            c.subtotal ||
            cantidad * precio
          );

        const porcentaje =
          Number(
            c.descuentoporcentaje ||
            0
          );

        const descuento =
          Number(
            c.monto_descuento ||
            subtotal *
            porcentaje /
            100
          );

        const total =
          Number(
            c.total ||
            Math.max(
              0,
              subtotal -
              descuento
            )
          );

        const precioFinal =
          cantidad > 0
            ? total / cantidad
            : 0;

        const abono =
          Math.min(
            Number(
              c.abono || 0
            ),
            total
          );

        const restante =
          Math.max(
            0,
            total -
            abono
          );

        const folio =
          obtenerFolio(c);

        const fecha =
          fechaBonita(
            c.fechacotizacion
          );

        return `

          <div
            class="cotizacion"
            id="cotizacion-${c.id}">

            <!-- ENCABEZADO CLICKEABLE -->

            <div
              class="cotizacion-cabecera"
              onclick="alternarCotizacion(${c.id})">

              <div class="cotizacion-identidad">

                <div class="cliente-linea">

                  <span class="folio">
                    ${folio}
                  </span>

                  <span class="cliente">
                    ${escapeHtml(
                      c.cliente ||
                      "Sin nombre"
                    )}
                  </span>

                  <span class="fecha-cabecera">
                    ${fecha}
                  </span>

                </div>

                <div class="telefono">

                  ${escapeHtml(
                    c.telefono ||
                    "Sin teléfono"
                  )}

                </div>

              </div>

              <div class="cabecera-derecha">

                <div class="estado">
                  ${escapeHtml(
                    c.estado ||
                    "Pendiente"
                  )}
                </div>

                <div class="flecha">
                  ▼
                </div>

              </div>

            </div>

            <!-- CONTENIDO DESPLEGABLE -->

            <div class="cotizacion-detalle">

              <div class="datos">

                <div class="dato">

                  <small>
                    Producto
                  </small>

                  <strong>
                    ${escapeHtml(
                      c.producto ||
                      "—"
                    )}
                  </strong>

                </div>

                <div class="dato">

                  <small>
                    Cantidad
                  </small>

                  <strong>
                    ${cantidad}
                  </strong>

                </div>

                <div class="dato">

                  <small>
                    Precio unitario
                  </small>

                  <strong>
                    ${dinero(precio)}
                  </strong>

                </div>

                <div class="dato">

                  <small>
                    Subtotal
                  </small>

                  <strong>
                    ${dinero(subtotal)}
                  </strong>

                </div>

                <div class="dato">

                  <small>
                    Descuento
                  </small>

                  <strong>
                    ${porcentaje.toFixed(2)}%
                    ·
                    ${dinero(descuento)}
                  </strong>

                </div>

                <div class="dato">

                  <small>
                    Precio final por pieza
                  </small>

                  <strong>
                    ${dinero(precioFinal)}
                  </strong>

                </div>

                <div class="dato dato-total">

                  <small>
                    Total
                  </small>

                  <strong>
                    ${dinero(total)}
                  </strong>

                </div>

                <div class="dato">

                  <small>
                    Abono
                  </small>

                  <strong>
                    ${dinero(abono)}
                  </strong>

                </div>

                <div class="dato dato-total">

                  <small>
                    Restante
                  </small>

                  <strong>
                    ${dinero(restante)}
                  </strong>

                </div>

                <div class="dato">

                  <small>
                    Fecha de cotización
                  </small>

                  <strong>
                    ${fechaBonita(
                      c.fechacotizacion
                    )}
                  </strong>

                </div>

                <div class="dato">

                  <small>
                    Fecha de entrega
                  </small>

                  <strong>
                    ${fechaBonita(
                      c.fechaentrega
                    )}
                  </strong>

              </div>

              ${
                c.notas
                  ? `

                      ${escapeHtml(

                  onclick="

                  ">

                <button

/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escapeHtml(text) {

  return String(
    text ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

function abrirNuevaCotizacion() {

  editandoId = null;

  document.getElementById(
    "tituloModal"
  ).textContent =
    "Nueva cotización";

  document.getElementById(
    "cliente"
  ).value = "";

  document.getElementById(
    "telefono"
  ).value = "";

  document.getElementById(
    "producto"
  ).value =
    "BottleBox";

  document.getElementById(
    "cantidad"
  ).value =
    1;

  document.getElementById(
    "descuentoPorcentaje"
  ).value =
    0;

  document.getElementById(
    "abono"
  ).value =
    0;

  const hoy =
    new Date()
      .toISOString()
      .split("T")[0];

  document.getElementById(
    "fechaCotizacion"
  ).value =
    hoy;

  document.getElementById(
    "fechaEntrega"
  ).value =
    "";

  document.getElementById(
    "estado"

    "notas"
  ).value =
    "";

  actualizarPrecioProducto();

  document.getElementById(
    "modal"
  ).classList.add(
    "activo"

/* =========================================================
   CERRAR MODAL
========================================================= */

function cerrarModal() {

  document.getElementById(
    "modal"
  ).classList.remove(
    "activo"
  );
}

/* =========================================================
   EDITAR
========================================================= */

function editarCotizacion(id) {

  const c =
    cotizaciones.find(
      x =>
        Number(x.id) ===
        Number(id)
    );

  if (!c) return;

  editandoId =
    c.id;

  document.getElementById(
    "tituloModal"
  ).textContent =
    "Editar cotización";

  document.getElementById(
    "cliente"
  ).value =
    c.cliente || "";

  document.getElementById(
    "telefono"
  ).value =
    c.telefono || "";

  document.getElementById(
    "producto"
  ).value =
    c.producto ||
    "BottleBox";

  document.getElementById(
    "cantidad"
  ).value =
    c.cantidad || 1;

  document.getElementById(
    "precio"
  ).value =
    c.precio ||
    preciosProductos[
      c.producto
    ] ||
    0;

  document.getElementById(
    "descuentoPorcentaje"
  ).value =
    c.descuentoporcentaje ||
    0;

  document.getElementById(
    "abono"
  ).value =
    c.abono ||
    0;

  document.getElementById(
    "fechaCotizacion"
  ).value =
    c.fechacotizacion ||
    "";

  document.getElementById(
    "fechaEntrega"
  ).value =
    c.fechaentrega ||
    "";

  document.getElementById(
    "estado"
  ).value =
    c.estado ||
    "Pendiente";

  document.getElementById(
    "notas"
  ).value =
    c.notas ||
    "";

  calcularTotal();

  document.getElementById(
    "modal"
  ).classList.add(
    "activo"
  );
}

/* =========================================================
   GUARDAR
========================================================= */

async function guardarNuevaCotizacion() {

  const cliente =
    document.getElementById(
      "cliente"
    ).value.trim();

  if (!cliente) {

    alert(
      "Escribe el nombre del cliente."
    );

    return;
  }

  const cantidad =
    Number(
      document.getElementById(
        "cantidad"
      ).value
    ) || 0;

  const precio =
    Number(
      document.getElementById(
        "precio"
      ).value
    ) || 0;

  const descuentoPorcentaje =
    Number(
      document.getElementById(
        "descuentoPorcentaje"
      ).value
    ) || 0;

  const abonoIngresado =
    Number(
      document.getElementById(
        "abono"
      ).value
    ) || 0;

  const subtotal =
    cantidad *
    precio;

  const montoDescuento =
    subtotal *
    (
      descuentoPorcentaje /
      100
    );

  const total =
    Math.max(
      0,
      subtotal -
      montoDescuento
    );

  const abono =
    Math.min(
      Math.max(
        0,
        abonoIngresado
      ),
      total
    );

  const datos = {

    cliente,

    telefono:
      document.getElementById(
        "telefono"
      ).value.trim(),

    producto:
      document.getElementById(
        "producto"
      ).value,

    cantidad,

    precio,

    descuentoporcentaje:
      descuentoPorcentaje,

    monto_descuento:
      montoDescuento,

    subtotal,

    total,

    abono,

    fechacotizacion:
      document.getElementById(
        "fechaCotizacion"
      ).value ||
      null,

    fechaentrega:
      document.getElementById(
        "fechaEntrega"
      ).value ||
      null,

    estado:
      document.getElementById(
        "estado"
      ).value,

    notas:
      document.getElementById(
        "notas"
      ).value.trim()
  };

  let error;

  if (editandoId) {

    const respuesta =
      await supabaseClient
        .from(
          "cotizaciones"
        )
        .update(datos)
        .eq(
          "id",
          editandoId
        );

    error =
      respuesta.error;

  } else {

    const respuesta =
      await supabaseClient
        .from(
          "cotizaciones"
        )
        .insert(
          datos
        );

    error =
      respuesta.error;
  }

  if (error) {

    console.error(
      error
    );

    alert(
      "No se pudo guardar la cotización."
    );

    return;
  }

  cerrarModal();

  await cargarCotizaciones();
}

/* =========================================================
   ELIMINAR
========================================================= */

async function eliminarCotizacion(id) {

  const confirmar =
    confirm(
      "¿Seguro que quieres eliminar esta cotización?"
    );

  if (!confirmar) return;

  const {
    error
  } =
    await supabaseClient
      .from(
        "cotizaciones"
      )
      .delete()
      .eq(
        "id",
        id
      );

  if (error) {

    console.error(
      error
    );

    alert(
      "No se pudo eliminar."
    );

    return;
  }

  await cargarCotizaciones();
}

/* =========================================================
   TICKET
========================================================= */

async function descargarTicketCotizacion(id) {

  const cotizacion =
    cotizaciones.find(
      c =>
        Number(c.id) ===
        Number(id)
    );

  if (!cotizacion) {

    alert(
      "No se encontró la cotización."
    );

    return;
  }

  if (
    !window.jspdf ||
    !window.jspdf.jsPDF
  ) {

    alert(
      "No se pudo cargar el generador de PDF. Revisa tu conexión a internet."
    );

    return;
  }

  try {

    const existente =
      await supabaseClient
        .from(
          "comprobantes"
        )
        .select("*")
        .eq(
          "cotizacion_id",
          cotizacion.id
        )
        .eq(
          "tipo",
          "cotizacion"
        )
        .limit(1)
        .maybeSingle();

    if (
      existente.data &&
      existente.data.archivo_url
    ) {

      const descargaExistente =
        await supabaseClient
          .storage
          .from(
            "comprobantes"
          )
          .download(
            existente.data.archivo_url
          );

      if (
        !descargaExistente.error &&
        descargaExistente.data
      ) {

        descargarBlob(
          descargaExistente.data,
          generarNombreArchivo(
            cotizacion
          )
        );

        return;
      }
    }

    const doc =
      await crearPdfCotizacion(
        cotizacion
      );

    const pdfBlob =
      doc.output(
        "blob"
      );

    const folio =
      obtenerFolio(
        cotizacion
      );

    const nombreArchivo =
      generarNombreArchivo(
        cotizacion
      );

    const ruta =
      "cotizaciones/" +
      folio +
      ".pdf";

    const subida =
      await supabaseClient
        .storage
        .from(
          "comprobantes"
        )
        .upload(
          ruta,
          pdfBlob,
          {
            contentType:
              "application/pdf",
            upsert:
              false
          }
        );

    if (subida.error) {

      console.error(
        "Error al subir PDF:",
        subida.error
      );

      alert(
        "El PDF se generó, pero no se pudo guardar en Supabase.\n\nSe descargará normalmente."
      );

      descargarBlob(
        pdfBlob,
        nombreArchivo
      );

      return;
    }

    const registro = {

      tipo:
        "cotizacion",

      cotizacion_id:
        cotizacion.id,

      folio,

      cliente:
        cotizacion.cliente ||
        "",

      telefono:
        cotizacion.telefono ||
        "",

      producto:
        cotizacion.producto ||
        "",

      total:
        Number(
          cotizacion.total ||
          0
        ),

      abono:
        Number(
          cotizacion.abono ||
          0
        ),

      restante:
        Math.max(
          0,
          Number(
            cotizacion.total ||
            0
          ) -
          Number(
            cotizacion.abono ||
            0
          )
        ),

      archivo_url:
        ruta
    };

    const guardado =
      await supabaseClient
        .from(
          "comprobantes"
        )
        .insert(
          registro
        );

    if (guardado.error) {

      console.error(
        "Error al registrar comprobante:",
        guardado.error
      );

      alert(
        "El PDF se guardó en Storage, pero no se pudo registrar en la tabla de comprobantes.\n\nSe descargará normalmente."
      );

      descargarBlob(
        pdfBlob,
        nombreArchivo
      );

      return;
    }

    descargarBlob(
      pdfBlob,
      nombreArchivo
    );

    alert(
      "Ticket guardado correctamente en Supabase y descargado."
    );

  } catch (error) {

    console.error(
      "Error completo del ticket:",
      error
    );

    alert(
      "Hubo un problema al guardar el ticket. Revisa la consola."
    );
  }
}

/* =========================================================
   DESCARGAR BLOB
========================================================= */

function descargarBlob(
  blob,
  nombreArchivo
) {

  const url =
    URL.createObjectURL(
      blob
    );

  const enlace =
    document.createElement(
      "a"
    );

  enlace.href =
    url;

  enlace.download =
    nombreArchivo +
    ".pdf";

  document.body.appendChild(
    enlace
  );

  enlace.click();

  enlace.remove();

  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );
}

/* =========================================================
   NOMBRE DEL PDF
========================================================= */

function generarNombreArchivo(
  cotizacion
) {

  const cliente =
    String(
      cotizacion.cliente ||
      "cliente"
    )
      .replace(
        /[^a-z0-9áéíóúñ ]/gi,
        ""
      )
      .trim()
      .replace(
        /\s+/g,
        "-"
      );

  return (
    "Cotizacion-" +
    obtenerFolio(
      cotizacion
    ) +
    "-" +
    (
      cliente ||
      "cliente"
    )
  );
}

/* =========================================================
   CARGAR LOGO PARA PDF
========================================================= */

async function cargarImagenBase64(
  url
) {

  const respuesta =
    await fetch(
      url
    );

  if (!respuesta.ok) {

    throw new Error(
      "No se pudo cargar la imagen."
    );
  }

  const blob =
    await respuesta.blob();

  return await new Promise(
    (
      resolve,
      reject
    ) => {

      const lector =
        new FileReader();

      lector.onloadend =
        () =>
          resolve(
            lector.result
          );

      lector.onerror =
        reject;

      lector.readAsDataURL(
        blob
      );
    }
  );
}

/* =========================================================
   CARGAR COTIZACIONES
========================================================= */

async function cargarCotizaciones() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "cotizaciones"
      )
      .select("*")
      .order(
        "fechacotizacion",
        {
          ascending:
            false
        }
      );

  if (error) {

    console.error(
      error
    );

    document.getElementById(
      "listaCotizaciones"
    ).innerHTML = `
      <div class="vacio">
        No se pudieron cargar las cotizaciones.
      </div>
    `;

    return;
  }

  cotizaciones =
    data || [];

  actualizarResumen();

  mostrarCotizaciones();
}
