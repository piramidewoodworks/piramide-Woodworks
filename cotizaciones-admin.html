<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cotizaciones | Pirámide Woodworks</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --negro: #171717;
            --crema: #f7f5f1;
            --blanco: #ffffff;
            --texto: #26221e;
            --texto-suave: #716b64;
            --dorado: #b28a52;
            --dorado-claro: #d1b27d;
            --linea: #e7e2db;
            --rojo: #9b3d3d;
            --verde: #55735a;
        }

        body {
            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color: white;

            background:
                linear-gradient(
                    rgba(20, 14, 10, .82),
                    rgba(20, 14, 10, .92)
                ),
                repeating-linear-gradient(
                    92deg,
                    #3a281d 0px,
                    #493225 55px,
                    #34231a 58px,
                    #52382a 115px,
                    #39271c 118px
                );
        }

        header {
            text-align: center;
            padding: 34px 20px 24px;
        }

        header h1 {
            font-size: clamp(27px, 5vw, 40px);
            font-weight: 500;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 8px;
            color: var(--dorado-claro);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .panel {
            width: min(1100px, calc(100% - 30px));
            margin: auto;
            padding-bottom: 60px;
        }

        .barra-superior {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 22px;
        }

        .volver {
            color: var(--dorado-claro);
            text-decoration: none;
            font-size: 13px;
        }

        .volver:hover {
            color: white;
        }

        .boton-principal {
            border: 0;
            border-radius: 7px;
            padding: 11px 17px;
            background: var(--dorado);
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: .2s ease;
        }

        .boton-principal:hover {
            background: #9a713b;
        }

        .resumen {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 13px;
            margin-bottom: 24px;
        }

        .tarjeta {
            background: rgba(255, 255, 255, .97);
            color: var(--texto);
            border-radius: 11px;
            padding: 18px;
            box-shadow:
                0 8px 25px rgba(0, 0, 0, .15);
        }

        .tarjeta span {
            display: block;
            color: var(--texto-suave);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .tarjeta strong {
            font-size: 23px;
            font-weight: 600;
        }

        .dorado {
            color: #9a713b;
        }

        .herramientas {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .buscador,
        .filtro {
            border: 1px solid var(--linea);
            background: white;
            color: var(--texto);
            border-radius: 7px;
            padding: 11px 13px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .buscador {
            flex: 1;
        }

        .filtro {
            width: 170px;
        }

        .buscador:focus,
        .filtro:focus {
            border-color: var(--dorado);
        }

        #listaCotizaciones {
            display: grid;
            gap: 13px;
        }

        .cotizacion {
            background: rgba(255, 255, 255, .97);
            color: var(--texto);
            border-radius: 12px;
            padding: 20px;
            box-shadow:
                0 8px 25px rgba(0, 0, 0, .15);
        }

        .cotizacion-cabecera {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--linea);
        }

        .cliente {
            font-size: 17px;
            font-weight: 600;
        }

        .telefono {
            margin-top: 4px;
            color: var(--texto-suave);
            font-size: 12px;
        }

        .estado {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            white-space: nowrap;
        }

        .estado-pendiente {
            background: #f2e9d9;
            color: #87632e;
        }

        .estado-contactado {
            background: #e9edf0;
            color: #596873;
        }

        .estado-cotizada {
            background: #eee8df;
            color: #755b3c;
        }

        .estado-entregada {
            background: #e5eee6;
            color: var(--verde);
        }

        .estado-cancelada {
            background: #f1e2e2;
            color: var(--rojo);
        }

        .datos {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            padding: 16px 0;
        }

        .dato span {
            display: block;
            color: var(--texto-suave);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .8px;
            margin-bottom: 5px;
        }

        .dato strong {
            font-size: 14px;
            font-weight: 600;
        }

        .dato-total strong {
            color: #9a713b;
            font-size: 18px;
        }

        .dato-restante strong {
            color: var(--rojo);
            font-size: 17px;
        }

        .dato-abono strong {
            color: var(--verde);
        }

        .notas {
            padding-top: 13px;
            border-top: 1px solid var(--linea);
            color: var(--texto-suave);
            font-size: 13px;
            line-height: 1.5;
        }

        .acciones {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 15px;
        }

        .boton-secundario,
        .boton-eliminar {
            border-radius: 6px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .boton-secundario {
            border: 1px solid var(--linea);
            background: #f7f5f1;
            color: var(--texto);
        }

        .boton-secundario:hover {
            border-color: var(--dorado);
        }

        .boton-eliminar {
            border: 1px solid #ead3d3;
            background: #faf1f1;
            color: var(--rojo);
        }

        .boton-eliminar:hover {
            background: #f5e4e4;
        }

        .vacio {
            background: rgba(255,255,255,.97);
            color: var(--texto-suave);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            font-size: 14px;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.68);
            z-index: 1000;
        }

        .modal.activo {
            display: flex;
        }

        .modal-contenido {
            width: min(620px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: var(--crema);
            color: var(--texto);
            border-radius: 13px;
            padding: 25px;
            box-shadow:
                0 20px 60px rgba(0,0,0,.35);
        }

        .modal-cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-cabecera h2 {
            font-size: 21px;
            font-weight: 600;
        }

        .cerrar-modal {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 50%;
            background: #ebe6df;
            color: var(--texto);
            font-size: 20px;
            cursor: pointer;
        }

        .formulario {
            display: grid;
            gap: 14px;
        }

        .campo {
            display: grid;
            gap: 6px;
        }

        .campo label {
            font-size: 11px;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .campo input,
        .campo select,
        .campo textarea {
            width: 100%;
            border: 1px solid var(--linea);
            border-radius: 7px;
            padding: 11px 12px;
            background: white;
            color: var(--texto);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .campo input:focus,
        .campo select:focus,
        .campo textarea:focus {
            border-color: var(--dorado);
        }

        .campo textarea {
            min-height: 85px;
            resize: vertical;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .fila-tres {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .fila-calculo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .total-formulario {
            background: white;
            border: 1px solid var(--linea);
            border-radius: 8px;
            padding: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-formulario span {
            color: var(--texto-suave);
            font-size: 12px;
        }

        .total-formulario strong {
            color: #9a713b;
            font-size: 20px;
        }

        .total-formulario.restante strong {
            color: var(--rojo);
        }

        .botones-formulario {
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            margin-top: 5px;
        }

        .boton-cancelar {
            border: 1px solid var(--linea);
            background: white;
            color: var(--texto);
            border-radius: 7px;
            padding: 10px 16px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .boton-guardar {
            border: 0;
            background: var(--dorado);
            color: white;
            border-radius: 7px;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .boton-guardar:hover {
            background: #9a713b;
        }

        footer {
            text-align: center;
            padding: 10px 20px 25px;
            color: rgba(255,255,255,.50);
            font-size: 12px;
        }

        @media (max-width: 800px) {

            .resumen {
                grid-template-columns: 1fr 1fr;
            }

            .datos {
                grid-template-columns: 1fr 1fr;
            }

            .fila-tres {
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (max-width: 500px) {

            .panel {
                width: calc(100% - 20px);
            }

            header {
                padding-top: 28px;
            }

            .barra-superior {
                align-items: flex-start;
            }

            .resumen {
                gap: 9px;
            }

            .tarjeta {
                padding: 16px;
            }

            .tarjeta strong {
                font-size: 20px;
            }

            .herramientas {
                flex-direction: column;
            }

            .filtro {
                width: 100%;
            }

            .cotizacion {
                padding: 17px;
            }

            .cotizacion-cabecera {
                flex-direction: column;
            }

            .datos {
                grid-template-columns: 1fr 1fr;
                gap: 13px;
            }

            .fila,
            .fila-tres,
            .fila-calculo {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 10px;
            }

            .modal-contenido {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>Pirámide Woodworks</h1>

    <p>Cotizaciones</p>

</header>


<main class="panel">


    <div class="barra-superior">

        <a
            href="panel.html"
            class="volver"
        >
            ← Volver al panel
        </a>

        <button
            type="button"
            class="boton-principal"
            onclick="abrirNuevaCotizacion()"
        >
            + Nueva cotización
        </button>

    </div>


    <section class="resumen">

        <div class="tarjeta">
            <span>Total</span>

            <strong
                id="totalCotizaciones"
                class="dorado"
            >
                0
            </strong>
        </div>

        <div class="tarjeta">
            <span>Pendientes</span>

            <strong id="totalPendientes">
                0
            </strong>
        </div>

        <div class="tarjeta">
            <span>Cotizadas</span>

            <strong id="totalCotizadas">
                0
            </strong>
        </div>

        <div class="tarjeta">
            <span>Entregadas</span>

            <strong id="totalEntregadas">
                0
            </strong>
        </div>

    </section>


    <section class="herramientas">

        <input
            type="search"
            id="buscador"
            class="buscador"
            placeholder="Buscar cliente o producto..."
            oninput="mostrarCotizaciones()"
        >

        <select
            id="filtroEstado"
            class="filtro"
            onchange="mostrarCotizaciones()"
        >

            <option value="Todos">
                Todos los estados
            </option>

            <option value="Pendiente">
                Pendientes
            </option>

            <option value="Contactado">
                Contactados
            </option>

            <option value="Cotizada">
                Cotizadas
            </option>

            <option value="Entregada">
                Entregadas
            </option>

            <option value="Cancelada">
                Canceladas
            </option>

        </select>

    </section>


    <section id="listaCotizaciones">

        <div class="vacio">
            Cargando cotizaciones...
        </div>

    </section>


</main>


<footer>
    Pirámide Woodworks · Cotizaciones
</footer>


<div
    id="modalCotizacion"
    class="modal"
>

    <div class="modal-contenido">

        <div class="modal-cabecera">

            <h2 id="tituloModal">
                Nueva cotización
            </h2>

            <button
                type="button"
                class="cerrar-modal"
                onclick="cerrarModal()"
            >
                ×
            </button>

        </div>


        <form
            id="formularioCotizacion"
            class="formulario"
            onsubmit="guardarNuevaCotizacion(event)"
        >

            <input
                type="hidden"
                id="cotizacionId"
            >


            <div class="fila">

                <div class="campo">

                    <label for="cliente">
                        Cliente
                    </label>

                    <input
                        type="text"
                        id="cliente"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                    >

                </div>

            </div>


            <div class="campo">

                <label for="producto">
                    Producto
                </label>

                <select
                    id="producto"
                    onchange="actualizarPrecioProducto()"
                    required
                >

                    <option value="">
                        Selecciona un producto
                    </option>

                    <option value="BottleBox">
                        BottleBox
                    </option>

                    <option value="TequilaBox">
                        TequilaBox
                    </option>

                    <option value="TequilaBox sin botella">
                        TequilaBox sin botella
                    </option>

                    <option value="GiftBox">
                        GiftBox
                    </option>

                    <option value="SlidingBox">
                        SlidingBox
                    </option>

                    <option value="Portallaves Home">
                        Portallaves Home
                    </option>

                    <option value="Mostrador QR & Códigos Personalizado">
                        Mostrador QR & Códigos Personalizado
                    </option>

                    <option value="Carruaje de Cenicienta">
                        Carruaje de Cenicienta
                    </option>

                    <option value="Mesa Carruaje Gigante">
                        Mesa Carruaje Gigante
                    </option>

                </select>

            </div>


            <div class="fila-tres">

                <div class="campo">

                    <label for="cantidad">
                        Cantidad
                    </label>

                    <input
                        type="number"
                        id="cantidad"
                        min="1"
                        step="1"
                        value="1"
                        required
                        oninput="calcularTotal()"
                    >

                </div>


                <div class="campo">

                    <label for="precio">
                        Precio por pieza
                    </label>

                    <input
                        type="number"
                        id="precio"
                        min="0"
                        step="0.01"
                        required
                        oninput="calcularTotal()"
                    >

                </div>


                <div class="campo">

                    <label for="descuentoPorcentaje">
                        Descuento %
                    </label>

                    <input
                        type="number"
                        id="descuentoPorcentaje"
                        min="0"
                        max="100"
                        step="0.01"
                        value="0"
                        oninput="calcularTotal()"
                    >

                </div>

            </div>


            <div class="fila-calculo">

                <div class="total-formulario">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        $0
                    </strong>

                </div>


                <div class="total-formulario">

                    <span>
                        Descuento
                    </span>

                    <strong id="montoDescuento">
                        $0
                    </strong>

                </div>

            </div>


            <div class="total-formulario">

                <span>
                    Precio final por pieza
                </span>

                <strong id="precioFinal">
                    $0
                </strong>

            </div>


            <div class="total-formulario">

                <span>
                    Total
                </span>

                <strong id="total">
                    $0
                </strong>

            </div>


            <div class="fila-calculo">

                <div class="campo">

                    <label for="abono">
                        Abono
                    </label>

                    <input
                        type="number"
                        id="abono"
                        min="0"
                        step="0.01"
                        value="0"
                        oninput="calcularTotal()"
                    >

                </div>


                <div class="total-formulario restante">

                    <span>
                        Restante
                    </span>

                    <strong id="restante">
                        $0
                    </strong>

                </div>

            </div>


            <div class="fila">

                <div class="campo">

                    <label for="fechaCotizacion">
                        Fecha de cotización
                    </label>

                    <input
                        type="date"
                        id="fechaCotizacion"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="fechaEntrega">
                        Fecha de entrega
                    </label>

                    <input
                        type="date"
                        id="fechaEntrega"
                    >

                </div>

            </div>


            <div class="campo">

                <label for="estado">
                    Estado
                </label>

                <select id="estado">

                    <option value="Pendiente">
                        Pendiente
                    </option>

                    <option value="Contactado">
                        Contactado
                    </option>

                    <option value="Cotizada">
                        Cotizada
                    </option>

                    <option value="Entregada">
                        Entregada
                    </option>

                    <option value="Cancelada">
                        Cancelada
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="notas">
                    Notas
                </label>

                <textarea
                    id="notas"
                    placeholder="Detalles, medidas, personalización..."
                ></textarea>

            </div>


            <div class="botones-formulario">

                <button
                    type="button"
                    class="boton-cancelar"
                    onclick="cerrarModal()"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="boton-guardar"
                >
                    Guardar cotización
                </button>

            </div>


        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
    "https://ighcydtijeumeqyhuvkh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_gI5akJYFXtqZxadDOuC4zg_cUCyXofV";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let cotizaciones = [];

let editandoId = null;


const preciosProductos = {

    "BottleBox": 600,

    "TequilaBox": 1200,

    "TequilaBox sin botella": 480,

    "GiftBox": 550,

    "SlidingBox": 400,

    "Portallaves Home": 130,

    "Mostrador QR & Códigos Personalizado": 120,

    "Carruaje de Cenicienta": 155,

    "Mesa Carruaje Gigante": 2500

};


function dinero(valor) {

    return "$" +
        (Number(valor) || 0).toLocaleString(
            "es-MX",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

}


function escapar(texto) {

    return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function claseEstado(estado) {

    const limpio =
        String(estado || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");

    if (limpio === "pendiente")
        return "estado-pendiente";

    if (limpio === "contactado")
        return "estado-contactado";

    if (limpio === "cotizada")
        return "estado-cotizada";

    if (limpio === "entregada")
        return "estado-entregada";

    if (limpio === "cancelada")
        return "estado-cancelada";

    return "estado-contactado";

}


function mostrarFecha(fecha) {

    if (!fecha) {
        return "—";
    }

    const partes =
        String(fecha).split("-");

    if (partes.length === 3) {

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }

    const fechaObj =
        new Date(fecha);

    if (isNaN(fechaObj.getTime())) {
        return fecha;
    }

    return fechaObj.toLocaleDateString(
        "es-MX"
    );

}


/* MIGRACIÓN */

async function migrarCotizacionesAntiguas() {

    const yaMigradas =
        localStorage.getItem(
            "cotizacionesMigradasSupabase"
        );

    if (yaMigradas === "true") {
        return;
    }


    const antiguas =
        JSON.parse(
            localStorage.getItem(
                "cotizaciones"
            ) || "[]"
        );


    if (!Array.isArray(antiguas) || antiguas.length === 0) {

        localStorage.setItem(
            "cotizacionesMigradasSupabase",
            "true"
        );

        return;
    }


    for (const c of antiguas) {

        const cantidad =
            Math.max(
                1,
                parseInt(c.cantidad, 10) || 1
            );


        const precio =
            Number(c.precio) || 0;


        const subtotal =
            precio * cantidad;


        /*
            Las cotizaciones antiguas
            guardaban el descuento
            directamente en pesos.

            Para no alterar su información,
            se conserva ese descuento.
        */

        const descuentoAntiguo =
            Math.max(
                0,
                Number(c.descuento) || 0
            );


        const total =
            c.total !== undefined &&
            c.total !== null
                ? Number(c.total) || 0
                : Math.max(
                    0,
                    subtotal - descuentoAntiguo
                );


        let estado =
            c.estado || "Pendiente";


        if (estado === "Cerrado") {
            estado = "Entregada";
        }


        const datos = {

            cliente:
                c.cliente ||
                c.nombre ||
                "",

            telefono:
                c.telefono ||
                c.celular ||
                "",

            producto:
                c.producto ||
                "",

            cantidad:
                cantidad,

            precio:
                precio,

            descuento:
                descuentoAntiguo,

            descuentoporcentaje:
                0,

            abono:
                Number(c.abono) || 0,

            total:
                total,

            fechacotizacion:
                c.fechaCotizacion ||
                c.fecha ||
                new Date().toISOString().slice(0, 10),

            fechaentrega:
                c.fechaentrega ||
                c.fechaEntrega ||
                null,

            estado:
                estado,

            notas:
                c.notas ||
                ""

        };


        const resultado =
            await supabaseClient
                .from("cotizaciones")
                .insert(datos);


        if (resultado.error) {

            console.error(
                "Error migrando cotización:",
                resultado.error
            );

        }

    }


    localStorage.setItem(
        "cotizacionesMigradasSupabase",
        "true"
    );

}


/* CARGAR */

async function cargarCotizaciones() {

    const resultado =
        await supabaseClient
            .from("cotizaciones")
            .select("*")
            .order(
                "fechacotizacion",
                {
                    ascending: false
                }
            );


    if (resultado.error) {

        console.error(
            "Error cargando cotizaciones:",
            resultado.error
        );

        document.getElementById(
            "listaCotizaciones"
        ).innerHTML = `
            <div class="vacio">
                No se pudieron cargar las cotizaciones.
            </div>
        `;

        return;

    }


    cotizaciones =
        (resultado.data || [])
            .map(function(c) {

                const cantidad =
                    Math.max(
                        1,
                        parseInt(c.cantidad, 10) || 1
                    );


                const precio =
                    Number(c.precio) || 0;


                const subtotal =
                    precio * cantidad;


                const porcentaje =
                    Math.max(
                        0,
                        Number(c.descuentoporcentaje) || 0
                    );


                const descuentoGuardado =
                    Number(c.descuento) || 0;


                const descuentoCalculado =
                    porcentaje > 0
                        ? subtotal * porcentaje / 100
                        : descuentoGuardado;


                const total =
                    c.total !== null &&
                    c.total !== undefined
                        ? Number(c.total) || 0
                        : Math.max(
                            0,
                            subtotal - descuentoCalculado
                        );


                const abono =
                    Math.min(
                        Math.max(
                            0,
                            Number(c.abono) || 0
                        ),
                        total
                    );


                const restante =
                    Math.max(
                        0,
                        total - abono
                    );


                return {

                    ...c,

                    cantidad:
                        cantidad,

                    precio:
                        precio,

                    descuento:
                        descuentoCalculado,

                    descuentoporcentaje:
                        porcentaje,

                    subtotal:
                        subtotal,

                    total:
                        total,

                    abono:
                        abono,

                    restante:
                        restante

                };

            });


    mostrarCotizaciones();

}


/* MOSTRAR */

function mostrarCotizaciones() {

    const lista =
        document.getElementById(
            "listaCotizaciones"
        );


    const buscador =
        document.getElementById(
            "buscador"
        ).value
            .toLowerCase()
            .trim();


    const filtro =
        document.getElementById(
            "filtroEstado"
        ).value;


    const filtradas =
        cotizaciones.filter(function(c) {

            const coincideTexto =
                !buscador ||
                String(c.cliente || "")
                    .toLowerCase()
                    .includes(buscador) ||
                String(c.producto || "")
                    .toLowerCase()
                    .includes(buscador) ||
                String(c.telefono || "")
                    .toLowerCase()
                    .includes(buscador);


            const coincideEstado =
                filtro === "Todos" ||
                c.estado === filtro;


            return (
                coincideTexto &&
                coincideEstado
            );

        });


    actualizarResumen();


    if (filtradas.length === 0) {

        lista.innerHTML = `
            <div class="vacio">
                No hay cotizaciones para mostrar.
            </div>
        `;

        return;

    }


    lista.innerHTML =
        filtradas.map(function(c) {

            const estado =
                c.estado || "Pendiente";


            return `

                <article class="cotizacion">

                    <div class="cotizacion-cabecera">

                        <div>

                            <div class="cliente">
                                ${escapar(c.cliente || "Sin cliente")}
                            </div>

                            ${
                                c.telefono
                                    ? `
                                        <div class="telefono">
                                            ${escapar(c.telefono)}
                                        </div>
                                      `
                                    : ""
                            }

                        </div>


                        <span
                            class="estado ${claseEstado(estado)}"
                        >
                            ${escapar(estado)}
                        </span>

                    </div>


                    <div class="datos">

                        <div class="dato">

                            <span>
                                Producto
                            </span>

                            <strong>
                                ${escapar(c.producto || "—")}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Cantidad
                            </span>

                            <strong>
                                ${c.cantidad}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Precio por pieza
                            </span>

                            <strong>
                                ${dinero(c.precio)}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Subtotal
                            </span>

                            <strong>
                                ${dinero(c.subtotal)}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Descuento
                            </span>

                            <strong>
                                ${Number(c.descuentoporcentaje || 0).toLocaleString("es-MX", {
                                    minimumFractionDigits: 0,
                                    maximumFractionDigits: 2
                                })}%
                                · ${dinero(c.descuento)}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Precio final por pieza
                            </span>

                            <strong>
                                ${dinero(
                                    c.cantidad > 0
                                        ? c.total / c.cantidad
                                        : 0
                                )}
                            </strong>

                        </div>


                        <div class="dato dato-total">

                            <span>
                                Total
                            </span>

                            <strong>
                                ${dinero(c.total)}
                            </strong>

                        </div>


                        <div class="dato dato-abono">

                            <span>
                                Abono
                            </span>

                            <strong>
                                ${dinero(c.abono)}
                            </strong>

                        </div>


                        <div class="dato dato-restante">

                            <span>
                                Restante
                            </span>

                            <strong>
                                ${dinero(c.restante)}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Cotización
                            </span>

                            <strong>
                                ${mostrarFecha(c.fechacotizacion)}
                            </strong>

                        </div>


                        <div class="dato">

                            <span>
                                Entrega
                            </span>

                            <strong>
                                ${mostrarFecha(c.fechaentrega)}
                            </strong>

                        </div>

                    </div>


                    ${
                        c.notas
                            ? `
                                <div class="notas">
                                    ${escapar(c.notas)}
                                </div>
                              `
                            : ""
                    }


                    <div class="acciones">

                        <button
                            type="button"
                            class="boton-secundario"
                            onclick="editarCotizacion(${c.id})"
                        >
                            Editar
                        </button>


                        <button
                            type="button"
                            class="boton-eliminar"
                            onclick="eliminarCotizacion(${c.id})"
                        >
                            Eliminar
                        </button>

                    </div>

                </article>

            `;

        }).join("");

}


/* RESUMEN */

function actualizarResumen() {

    document.getElementById(
        "totalCotizaciones"
    ).textContent =
        cotizaciones.length;


    document.getElementById(
        "totalPendientes"
    ).textContent =
        cotizaciones.filter(function(c) {

            return c.estado === "Pendiente";

        }).length;


    document.getElementById(
        "totalCotizadas"
    ).textContent =
        cotizaciones.filter(function(c) {

            return (
                c.estado === "Cotizada" ||
                c.estado === "Contactado"
            );

        }).length;


    document.getElementById(
        "totalEntregadas"
    ).textContent =
        cotizaciones.filter(function(c) {

            return c.estado === "Entregada";

        }).length;

}


/* NUEVA */

function abrirNuevaCotizacion() {

    editandoId = null;


    document.getElementById(
        "tituloModal"
    ).textContent =
        "Nueva cotización";


    document.getElementById(
        "formularioCotizacion"
    ).reset();


    document.getElementById(
        "cotizacionId"
    ).value = "";


    document.getElementById(
        "cantidad"
    ).value = 1;


    document.getElementById(
        "descuentoPorcentaje"
    ).value = 0;


    document.getElementById(
        "abono"
    ).value = 0;


    document.getElementById(
        "fechaCotizacion"
    ).value =
        new Date()
            .toISOString()
            .slice(0, 10);


    document.getElementById(
        "subtotal"
    ).textContent =
        "$0";


    document.getElementById(
        "montoDescuento"
    ).textContent =
        "$0";


    document.getElementById(
        "precioFinal"
    ).textContent =
        "$0";


    document.getElementById(
        "total"
    ).textContent =
        "$0";


    document.getElementById(
        "restante"
    ).textContent =
        "$0";


    document.getElementById(
        "modalCotizacion"
    ).classList.add("activo");

}


/* CERRAR */

function cerrarModal() {

    document.getElementById(
        "modalCotizacion"
    ).classList.remove("activo");

    editandoId = null;

}


/* PRECIO */

function actualizarPrecioProducto() {

    const producto =
        document.getElementById(
            "producto"
        ).value;


    if (
        producto &&
        preciosProductos[producto] !== undefined
    ) {

        document.getElementById(
            "precio"
        ).value =
            preciosProductos[producto];

    }


    calcularTotal();

}


/* CALCULAR */

function calcularTotal() {

    const cantidad =
        Math.max(
            1,
            parseInt(
                document.getElementById(
                    "cantidad"
                ).value,
                10
            ) || 1
        );


    const precio =
        Number(
            document.getElementById(
                "precio"
            ).value
        ) || 0;


    const porcentaje =
        Math.min(
            100,
            Math.max(
                0,
                Number(
                    document.getElementById(
                        "descuentoPorcentaje"
                    ).value
                ) || 0
            )
        );


    const abono =
        Math.max(
            0,
            Number(
                document.getElementById(
                    "abono"
                ).value
            ) || 0
        );


    const subtotal =
        precio * cantidad;


    const montoDescuento =
        subtotal * porcentaje / 100;


    const total =
        Math.max(
            0,
            subtotal - montoDescuento
        );


    const precioFinal =
        cantidad > 0
            ? total / cantidad
            : 0;


    const abonoAplicado =
        Math.min(
            abono,
            total
        );


    const restante =
        Math.max(
            0,
            total - abonoAplicado
        );


    document.getElementById(
        "subtotal"
    ).textContent =
        dinero(subtotal);


    document.getElementById(
        "montoDescuento"
    ).textContent =
        dinero(montoDescuento);


    document.getElementById(
        "precioFinal"
    ).textContent =
        dinero(precioFinal);


    document.getElementById(
        "total"
    ).textContent =
        dinero(total);


    document.getElementById(
        "restante"
    ).textContent =
        dinero(restante);

}


/* EDITAR */

function editarCotizacion(id) {

    const c =
        cotizaciones.find(function(item) {

            return Number(item.id) === Number(id);

        });


    if (!c) {
        return;
    }


    editandoId = c.id;


    document.getElementById(
        "tituloModal"
    ).textContent =
        "Editar cotización";


    document.getElementById(
        "cotizacionId"
    ).value =
        c.id;


    document.getElementById(
        "cliente"
    ).value =
        c.cliente || "";


    document.getElementById(
        "telefono"
    ).value =
        c.telefono || "";


    document.getElementById(
        "producto"
    ).value =
        c.producto || "";


    document.getElementById(
        "cantidad"
    ).value =
        c.cantidad || 1;


    document.getElementById(
        "precio"
    ).value =
        c.precio || 0;


    document.getElementById(
        "descuentoPorcentaje"
    ).value =
        c.descuentoporcentaje || 0;


    document.getElementById(
        "abono"
    ).value =
        c.abono || 0;


    document.getElementById(
        "fechaCotizacion"
    ).value =
        c.fechacotizacion || "";


    document.getElementById(
        "fechaEntrega"
    ).value =
        c.fechaentrega || "";


    document.getElementById(
        "estado"
    ).value =
        c.estado || "Pendiente";


    document.getElementById(
        "notas"
    ).value =
        c.notas || "";


    calcularTotal();


    document.getElementById(
        "modalCotizacion"
    ).classList.add("activo");

}


/* GUARDAR */

async function guardarNuevaCotizacion(evento) {

    evento.preventDefault();


    const boton =
        document.querySelector(
            ".boton-guardar"
        );


    boton.disabled = true;

    boton.textContent =
        "Guardando...";


    try {

        const cliente =
            document.getElementById(
                "cliente"
            ).value.trim();


        const telefono =
            document.getElementById(
                "telefono"
            ).value.trim();


        const producto =
            document.getElementById(
                "producto"
            ).value;


        const cantidad =
            Math.max(
                1,
                parseInt(
                    document.getElementById(
                        "cantidad"
                    ).value,
                    10
                ) || 1
            );


        const precio =
            Number(
                document.getElementById(
                    "precio"
                ).value
            ) || 0;


        const descuentoPorcentaje =
            Math.min(
                100,
                Math.max(
                    0,
                    Number(
                        document.getElementById(
                            "descuentoPorcentaje"
                        ).value
                    ) || 0
                )
            );


        const subtotal =
            precio * cantidad;


        const descuento =
            subtotal *
            descuentoPorcentaje /
            100;


        const total =
            Math.max(
                0,
                subtotal - descuento
            );


        const abono =
            Math.min(
                total,
                Math.max(
                    0,
                    Number(
                        document.getElementById(
                            "abono"
                        ).value
                    ) || 0
                )
            );


        const fechacotizacion =
            document.getElementById(
                "fechaCotizacion"
            ).value;


        const fechaentrega =
            document.getElementById(
                "fechaEntrega"
            ).value || null;


        const estado =
            document.getElementById(
                "estado"
            ).value;


        const notas =
            document.getElementById(
                "notas"
            ).value.trim();


        const datos = {

            cliente:
                cliente,

            telefono:
                telefono,

            producto:
                producto,

            cantidad:
                cantidad,

            precio:
                precio,

            descuentoporcentaje:
                descuentoPorcentaje,

            descuento:
                descuento,

            total:
                total,

            abono:
                abono,

            fechacotizacion:
                fechacotizacion,

            fechaentrega:
                fechaentrega,

            estado:
                estado,

            notas:
                notas

        };


        let resultado;


        if (editandoId) {

            resultado =
                await supabaseClient
                    .from("cotizaciones")
                    .update(datos)
                    .eq(
                        "id",
                        editandoId
                    );

        } else {

            resultado =
                await supabaseClient
                    .from("cotizaciones")
                    .insert(datos);

        }


        if (resultado.error) {
            throw resultado.error;
        }


        cerrarModal();

        await cargarCotizaciones();


    } catch (error) {

        console.error(
            "Error guardando cotización:",
            error
        );


        alert(
            "No se pudo guardar la cotización."
        );

    } finally {

        boton.disabled = false;

        boton.textContent =
            "Guardar cotización";

    }

}


/* ELIMINAR */

async function eliminarCotizacion(id) {

    const confirmar =
        confirm(
            "¿Quieres eliminar esta cotización?"
        );


    if (!confirmar) {
        return;
    }


    const resultado =
        await supabaseClient
            .from("cotizaciones")
            .delete()
            .eq(
                "id",
                id
            );


    if (resultado.error) {

        console.error(
            "Error eliminando cotización:",
            resultado.error
        );


        alert(
            "No se pudo eliminar la cotización."
        );


        return;

    }


    await cargarCotizaciones();

}


/* CERRAR MODAL AFUERA */

document
    .getElementById("modalCotizacion")
    .addEventListener(
        "click",
        function(evento) {

            if (
                evento.target ===
                this
            ) {

                cerrarModal();

            }

        }
    );


/* INICIO */

async function iniciar() {

    const resultado =
        await supabaseClient.auth.getSession();


    const sesion =
        resultado.data?.session;


    if (!sesion) {

        window.location.href =
            "admin.html";

        return;

    }


    await migrarCotizacionesAntiguas();

    await cargarCotizaciones();

}


iniciar();

</script>
