<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | Pirámide Woodworks</title>

    <style>
        :root {
            --negro: #171717;
            --blanco: #ffffff;
            --texto: #26221e;
            --texto-suave: #716b64;
            --dorado: #b28a52;
            --dorado-claro: #d1b27d;
            --linea: #e7e2db;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(20, 14, 10, 0.78),
                    rgba(20, 14, 10, 0.88)
                ),
                repeating-linear-gradient(
                    92deg,
                    #3a281d 0px,
                    #493225 55px,
                    #34231a 58px,
                    #52382a 115px,
                    #39271c 118px
                );
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--blanco);
        }

        header {
            text-align: center;
            padding: 42px 20px 28px;
        }

        header h1 {
            margin: 0;
            font-size: clamp(30px, 6vw, 44px);
            font-weight: 500;
            letter-spacing: 1px;
        }

        header p {
            margin: 8px 0 0;
            color: var(--dorado-claro);
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        main {
            width: min(100% - 30px, 1000px);
            margin: 0 auto 50px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--dorado-claro);
            text-decoration: none;
            font-size: 14px;
        }

        .acciones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .acciones h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 500;
        }

        .boton {
            border: 1px solid var(--dorado);
            background: var(--negro);
            color: white;
            padding: 11px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .boton:hover {
            background: #292929;
            border-color: var(--dorado-claro);
        }

        .resumen {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .resumen-card {
            background: rgba(255,255,255,0.96);
            color: var(--texto);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.18);
        }

        .resumen-card span {
            display: block;
            color: var(--texto-suave);
            font-size: 12px;
            margin-bottom: 7px;
        }

        .resumen-card strong {
            font-size: 25px;
            font-weight: 500;
            color: var(--dorado);
        }

        .filtros {
            background: rgba(255,255,255,0.96);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .filtros input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--linea);
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .cliente {
            background: rgba(255,255,255,0.97);
            color: var(--texto);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.18);
        }

        .cliente-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .cliente h3 {
            margin: 0 0 5px;
            font-size: 18px;
            font-weight: 600;
        }

        .cliente-info {
            color: var(--texto-suave);
            font-size: 14px;
            line-height: 1.7;
        }

        .cliente-numero {
            color: var(--dorado);
            font-size: 13px;
            white-space: nowrap;
        }

        .cliente-acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 17px;
            padding-top: 15px;
            border-top: 1px solid var(--linea);
        }

        .boton-secundario {
            border: 1px solid var(--linea);
            background: white;
            color: var(--texto);
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
        }

        .boton-secundario:hover {
            border-color: var(--dorado);
        }

        .boton-eliminar {
            color: #9b3d3d;
        }

        .vacio {
            background: rgba(255,255,255,0.96);
            color: var(--texto-suave);
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
        }

        .estado {
            background: rgba(255,255,255,0.96);
            color: var(--texto-suave);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 18px;
            font-size: 13px;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-contenido {
            background: white;
            color: var(--texto);
            width: min(100%, 600px);
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 14px;
            padding: 24px;
        }

        .modal-contenido h2 {
            margin-top: 0;
            font-weight: 500;
        }

        .campo {
            margin-bottom: 13px;
        }

        .campo label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--texto-suave);
        }

        .campo input,
        .campo textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--linea);
            border-radius: 7px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .campo textarea {
            min-height: 90px;
            resize: vertical;
        }

        .modal-botones {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .resumen {
                grid-template-columns: 1fr;
            }

            .cliente-top {
                flex-direction: column;
            }

            .cliente-numero {
                white-space: normal;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Clientes</h1>
    <p>Pirámide Woodworks</p>
</header>

<main>

    <a href="panel.html" class="volver">← Volver al panel</a>

    <div class="acciones">
        <h2>Directorio de clientes</h2>

        <button class="boton" onclick="abrirModal()">
            + Nuevo cliente
        </button>
    </div>

    <div class="estado" id="estado"></div>

    <section class="resumen">

        <div class="resumen-card">
            <span>Total de clientes</span>
            <strong id="totalClientes">0</strong>
        </div>

        <div class="resumen-card">
            <span>Con teléfono</span>
            <strong id="conTelefono">0</strong>
        </div>

        <div class="resumen-card">
            <span>Con correo</span>
            <strong id="conCorreo">0</strong>
        </div>

    </section>

    <section class="filtros">

        <input
            type="text"
            id="busqueda"
            placeholder="Buscar por nombre, teléfono o correo..."
            oninput="mostrarClientes()"
        >

    </section>

    <section id="listaClientes"></section>

</main>

<div class="modal" id="modalCliente">

    <div class="modal-contenido">

        <h2>Nuevo cliente</h2>

        <div class="campo">
            <label>Nombre</label>
            <input type="text" id="nombre">
        </div>

        <div class="campo">
            <label>Teléfono</label>
            <input type="tel" id="telefono">
        </div>

        <div class="campo">
            <label>Correo electrónico</label>
            <input type="email" id="correo">
        </div>

        <div class="campo">
            <label>Dirección</label>
            <input type="text" id="direccion">
        </div>

        <div class="campo">
            <label>Notas</label>
            <textarea id="notas"></textarea>
        </div>

        <div class="modal-botones">

            <button
                class="boton-secundario"
                onclick="cerrarModal()">
                Cancelar
            </button>

            <button
                class="boton"
                onclick="guardarCliente()">
                Guardar cliente
            </button>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ighcydtijeumeqyhuvkh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_gI5akJYFXtqZxadDOuC4zg_cUCyXofV";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let clientes = [];

/* =========================
   AUTENTICACIÓN
========================= */

async function verificarSesion() {

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if (error || !data.session) {

        window.location.href = "admin.html";

        return false;
    }

    return true;
}

/* =========================
   ESTADO
========================= */

function mostrarEstado(mensaje, tipo = "normal") {

    const estado =
        document.getElementById("estado");

    estado.textContent = mensaje;
    estado.style.display = "block";

    if (tipo === "error") {
        estado.style.color = "#9b3d3d";
    } else {
        estado.style.color = "#716b64";
    }

    clearTimeout(window.estadoTimer);

    window.estadoTimer =
        setTimeout(function() {
            estado.style.display = "none";
        }, 3500);
}

/* =========================
   SEGURIDAD HTML
========================= */

function escaparHTML(valor) {

    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================
   MODAL
========================= */

function abrirModal() {

    document.getElementById("modalCliente").style.display =
        "flex";

    document.getElementById("nombre").focus();
}

function cerrarModal() {

    document.getElementById("modalCliente").style.display =
        "none";

    document.getElementById("nombre").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("correo").value = "";
    document.getElementById("direccion").value = "";
    document.getElementById("notas").value = "";
}

/* =========================
   MIGRACIÓN LOCAL
========================= */

async function migrarClientesAntiguos() {

    const migrados =
        localStorage.getItem(
            "clientesMigradosSupabase"
        );

    if (migrados === "true") {
        return;
    }

    const clientesLocales =
        JSON.parse(
            localStorage.getItem("clientes")
        ) || [];

    if (!clientesLocales.length) {

        localStorage.setItem(
            "clientesMigradosSupabase",
            "true"
        );

        return;
    }

    try {

        for (const cliente of clientesLocales) {

            const {
                error
            } = await supabaseClient
                .from("clientes")
                .insert({
                    nombre: cliente.nombre || "",
                    telefono: cliente.telefono || "",
                    correo: cliente.correo || "",
                    direccion: cliente.direccion || "",
                    notas: cliente.notas || "",
                    fecha: cliente.fecha
                        ? new Date(cliente.fecha).toISOString()
                        : new Date().toISOString()
                });

            if (error) {
                console.error(
                    "Error migrando cliente:",
                    error
                );
            }
        }

        localStorage.setItem(
            "clientesMigradosSupabase",
            "true"
        );

        mostrarEstado(
            "Clientes anteriores sincronizados."
        );

    } catch (error) {

        console.error(error);

        mostrarEstado(
            "No se pudieron migrar los clientes anteriores.",
            "error"
        );
    }
}

/* =========================
   CARGAR CLIENTES
========================= */

async function cargarClientes() {

    const {
        data,
        error
    } = await supabaseClient
        .from("clientes")
        .select("*")
        .order("fecha", {
            ascending: false
        });

    if (error) {

        console.error(error);

        mostrarEstado(
            "No se pudieron cargar los clientes.",
            "error"
        );

        return;
    }

    clientes = data || [];

    mostrarClientes();
}

/* =========================
   GUARDAR CLIENTE
========================= */

async function guardarCliente() {

    const nombre =
        document
            .getElementById("nombre")
            .value
            .trim();

    const telefono =
        document
            .getElementById("telefono")
            .value
            .trim();

    const correo =
        document
            .getElementById("correo")
            .value
            .trim();

    const direccion =
        document
            .getElementById("direccion")
            .value
            .trim();

    const notas =
        document
            .getElementById("notas")
            .value
            .trim();

    if (!nombre) {

        alert(
            "Escribe el nombre del cliente."
        );

        return;
    }

    const boton =
        document.querySelector(
            '.modal-botones .boton'
        );

    boton.disabled = true;
    boton.textContent = "Guardando...";

    try {

        const {
            error
        } = await supabaseClient
            .from("clientes")
            .insert({
                nombre: nombre,
                telefono: telefono,
                correo: correo,
                direccion: direccion,
                notas: notas,
                fecha: new Date().toISOString()
            });

        if (error) {

            console.error(error);

            alert(
                "No se pudo guardar el cliente."
            );

            return;
        }

        cerrarModal();

        await cargarClientes();

        mostrarEstado(
            "Cliente guardado y sincronizado."
        );

    } catch (error) {

        console.error(error);

        alert(
            "Ocurrió un error al guardar el cliente."
        );

    } finally {

        boton.disabled = false;
        boton.textContent = "Guardar cliente";
    }
}

/* =========================
   MOSTRAR CLIENTES
========================= */

function mostrarClientes() {

    const contenedor =
        document.getElementById(
            "listaClientes"
        );

    const campoBusqueda =
        document.getElementById(
            "busqueda"
        );

    const busqueda =
        campoBusqueda.value
            .toLowerCase()
            .trim();

    const filtrados =
        clientes.filter(function(cliente) {

            const nombre =
                String(
                    cliente.nombre || ""
                ).toLowerCase();

            const telefono =
                String(
                    cliente.telefono || ""
                ).toLowerCase();

            const correo =
                String(
                    cliente.correo || ""
                ).toLowerCase();

            return (
                nombre.includes(busqueda) ||
                telefono.includes(busqueda) ||
                correo.includes(busqueda)
            );
        });

    contenedor.innerHTML = "";

    if (filtrados.length === 0) {

        contenedor.innerHTML = `
            <div class="vacio">
                No hay clientes para mostrar.
            </div>
        `;

    } else {

        filtrados.forEach(function(cliente) {

            const nombre =
                escaparHTML(
                    cliente.nombre
                );

            const telefono =
                escaparHTML(
                    cliente.telefono
                );

            const correo =
                escaparHTML(
                    cliente.correo
                );

            const direccion =
                escaparHTML(
                    cliente.direccion
                );

            const notas =
                escaparHTML(
                    cliente.notas
                );

            const id =
                escaparHTML(
                    cliente.id
                );

            let contactoHTML = "";

            if (telefono) {

                contactoHTML += `
                    <div>
                        Teléfono: ${telefono}
                    </div>
                `;
            }

            if (correo) {

                contactoHTML += `
                    <div>
                        Correo: ${correo}
                    </div>
                `;
            }

            if (direccion) {

                contactoHTML += `
                    <div>
                        Dirección: ${direccion}
                    </div>
                `;
            }

            let notasHTML = "";

            if (notas) {

                notasHTML = `
                    <div
                        class="cliente-info"
                        style="margin-top:12px;"
                    >
                        <strong>Notas:</strong>
                        ${notas}
                    </div>
                `;
            }

            let whatsappHTML = "";

            if (telefono) {

                whatsappHTML = `
                    <button
                        class="boton-secundario"
                        onclick="abrirWhatsApp(
                            '${escaparAtributo(cliente.telefono)}',
                            '${escaparAtributo(cliente.nombre)}'
                        )">
                        WhatsApp
                    </button>
                `;
            }

            contenedor.innerHTML += `

                <article class="cliente">

                    <div class="cliente-top">

                        <div>

                            <h3>
                                ${nombre}
                            </h3>

                            <div class="cliente-info">
                                ${contactoHTML}
                            </div>

                        </div>

                        <div class="cliente-numero">
                            Cliente #${id}
                        </div>

                    </div>

                    ${notasHTML}

                    <div class="cliente-acciones">

                        ${whatsappHTML}

                        <button
                            class="boton-secundario boton-eliminar"
                            onclick="eliminarCliente('${escaparAtributo(cliente.id)}')">
                            Eliminar
                        </button>

                    </div>

                </article>

            `;
        });
    }

    actualizarResumen();
}

/* =========================
   ESCAPE PARA ATRIBUTOS
========================= */

function escaparAtributo(valor) {

    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\r/g, "")
        .replace(/\n/g, " ");
}

/* =========================
   ELIMINAR CLIENTE
========================= */

async function eliminarCliente(id) {

    const confirmar =
        confirm(
            "¿Seguro que quieres eliminar este cliente?"
        );

    if (!confirmar) {
        return;
    }

    try {

        const {
            error
        } = await supabaseClient
            .from("clientes")
            .delete()
            .eq("id", id);

        if (error) {

            console.error(error);

            alert(
                "No se pudo eliminar el cliente."
            );

            return;
        }

        await cargarClientes();

        mostrarEstado(
            "Cliente eliminado."
        );

    } catch (error) {

        console.error(error);

        alert(
            "Ocurrió un error al eliminar el cliente."
        );
    }
}

/* =========================
   WHATSAPP
========================= */

function abrirWhatsApp(
    telefono,
    nombre
) {

    const numero =
        String(telefono)
            .replace(/\D/g, "");

    if (!numero) {
        return;
    }

    const texto =
        "Hola " +
        nombre +
        ", te escribimos de Pirámide Woodworks.";

    window.open(
        "https://wa.me/52" +
        numero +
        "?text=" +
        encodeURIComponent(texto),
        "_blank"
    );
}

/* =========================
   RESUMEN
========================= */

function actualizarResumen() {

    document.getElementById(
        "totalClientes"
    ).textContent =
        clientes.length;

    document.getElementById(
        "conTelefono"
    ).textContent =
        clientes.filter(function(cliente) {

            return String(
                cliente.telefono || ""
            ).trim() !== "";

        }).length;

    document.getElementById(
        "conCorreo"
    ).textContent =
        clientes.filter(function(cliente) {

            return String(
                cliente.correo || ""
            ).trim() !== "";

        }).length;
}

/* =========================
   INICIO
========================= */

async function iniciar() {

    const sesion =
        await verificarSesion();

    if (!sesion) {
        return;
    }

    await migrarClientesAntiguos();

    await cargarClientes();
}

iniciar();

</script>

</body>
</html>
